#
# rocq-gate.yml — the Rocq (Coq) assumptions gate, as a reusable workflow.
# Enforcing.
#
#   detect   counts the .v sources and the listed files; fails when .v files
#            exist and no file is listed, or a listed file does not exist
#   prove    installs Coq from the Ubuntu 24.04 archive, asserts the PINNED
#            build (coq 8.18.0+dfsg-1build2, /usr/bin/coqc at its SHA-256),
#            proves the judge can say no (closed theorems accepted; an Axiom,
#            an Admitted lemma, disabled guard, universe or positivity
#            checking, an ill-typed file and a Notation that forges coqc's
#            output refused), compiles each listed file with coqc, then
#            re-checks the modules out of process with coqchk (also pinned) and
#            reads its CONTEXT SUMMARY: no axiom, no type-in-type, no unsafe
#            fixpoint, no assumed positivity, module-wide. Nothing the file
#            prints is evidence. Optionally a named set of theorems must exist
#   verdict  one context to require; a skipped prove with sources present is
#            VOID, not green
#
# Gate scripts are pinned at the caller's own `uses:` SHA — see spark-gate.yml.
# Coq comes from the Ubuntu archive, not from the caller's Guix manifest: a
# deviation under PROOF-POLICY section 6, caught by the pin assertion.

name: Rocq Gate (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Linux x86_64 runner label (the pins are Ubuntu 24.04 builds; use ubuntu-24.04)
        type: string
        required: false
        default: ubuntu-24.04
      working_directory:
        description: Tree root
        type: string
        required: false
        default: "."
      files:
        description: Whitespace-separated .v files to compile with coqc, dependencies first
        type: string
        required: false
        default: "verification/proofs/coq/Haruspex.v"
      required_theorems:
        description: Whitespace-separated theorem names that must each resolve to a constant of a listed module (existence only; axioms are judged module-wide); empty for none
        type: string
        required: false
        default: ""
      allowed_axioms:
        description: Whitespace-separated axiom names the module may use (full names as the checker prints them); empty for none. sorryAx is never allowable
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Every `run:` step gets bash with -e AND pipefail. GitHub's default when no
# shell is named is `bash -e` without pipefail, which would let a failing
# gate script hide behind the `| tee` that records its facts.
defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect Rocq sources
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      units: ${{ steps.facts.outputs.units }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the suite repository and commit this caller pins
        id: suite
        env:
          SUITE_WORKFLOW: rocq-gate.yml
        # Inside a reusable workflow the `github` context is the CALLER's, so
        # GITHUB_WORKFLOW_REF names the caller's workflow file — which is in
        # the tree just checked out and holds the very `uses:` line GitHub
        # resolved to reach this file. That SHA pins the gate scripts: one
        # pin, held by the caller, selects both the workflow and its scripts.
        # (`github.job_workflow_sha` is an OIDC claim, not a context property,
        # and reading the token would need id-token: write from every caller.)
        run: |
          set -euo pipefail
          command -v yq >/dev/null || { echo '::error::yq is unavailable; source pin NOT VERIFIED'; exit 2; }
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/"* ]] || exit 2
          path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; path="${path%@*}"
          case "$path" in .github/workflows/*.yml|.github/workflows/*.yaml) ;; *) exit 2 ;; esac
          [[ "${path#.github/workflows/}" != */* && -f "$path" && ! -L "$path" ]] \
            || { echo '::error::caller workflow is absent or is not a direct workflow file; source pin NOT VERIFIED'; exit 2; }
          candidates=$(yq -r '.jobs[] | select(has("uses")) | .uses' "$path") \
            || { echo '::error::caller workflow cannot be parsed; source pin NOT VERIFIED'; exit 2; }
          refs=''
          while IFS= read -r ref; do
            # Other reusable workflows do not select this gate's source.
            [[ "$ref" == */.github/workflows/"$SUITE_WORKFLOW"* ]] || continue
            case "$ref" in
              hyperpolymath/cicd-suite/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd-and-workflows/.github/workflows/"$SUITE_WORKFLOW"@*)
                repository=${ref%%/.github/workflows/*}
                sha=${ref##*@}
                [[ "$sha" =~ ^[0-9a-f]{40}$ && "$ref" == "$repository/.github/workflows/$SUITE_WORKFLOW@$sha" ]] \
                  || { echo '::error::suite caller must pin one complete 40-hex SHA; source pin NOT VERIFIED'; exit 2; }
                refs+="$repository@$sha"$'\n'
                ;;
              *) echo '::error::unexpected suite source reference; source pin NOT VERIFIED'; exit 2 ;;
            esac
          done <<< "$candidates"
          refs=$(printf '%s' "$refs" | sort -u)
          n=$(printf '%s' "$refs" | grep -c . || true)
          [[ "$n" -eq 1 ]] \
            || { echo "::error::$path selects $n distinct suite repository/commit pairs; exactly one is required. NO CHECK WAS PERFORMED."; exit 2; }
          repository=${refs%@*}
          sha=${refs##*@}
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          echo "Suite source pinned at $repository@$sha by $path"
      - name: Check out the selected suite at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse gate scripts from an unverified cicd-suite commit
        env:
          EXPECTED: ${{ steps.suite.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ steps.suite.outputs.repository }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Facts
        id: facts
        env:
          ROCQ_GATE_PHASE: detect
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          FILES: ${{ inputs.files }}
          REQUIRED_THEOREMS: ${{ inputs.required_theorems }}
          ALLOWED_AXIOMS: ${{ inputs.allowed_axioms }}
        run: bash .cicd-suite/actions/rocq-check/check.sh | tee -a "$GITHUB_OUTPUT"

  prove:
    name: Rocq (coqc, Print Assumptions)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    needs: detect
    if: ${{ needs.detect.outputs.units != '0' && needs.detect.outputs.units != '' }}
    permissions:
      contents: read

    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the suite repository and commit this caller pins
        id: suite
        env:
          SUITE_WORKFLOW: rocq-gate.yml
        # Inside a reusable workflow the `github` context is the CALLER's, so
        # GITHUB_WORKFLOW_REF names the caller's workflow file — which is in
        # the tree just checked out and holds the very `uses:` line GitHub
        # resolved to reach this file. That SHA pins the gate scripts: one
        # pin, held by the caller, selects both the workflow and its scripts.
        # (`github.job_workflow_sha` is an OIDC claim, not a context property,
        # and reading the token would need id-token: write from every caller.)
        run: |
          set -euo pipefail
          command -v yq >/dev/null || { echo '::error::yq is unavailable; source pin NOT VERIFIED'; exit 2; }
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/"* ]] || exit 2
          path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; path="${path%@*}"
          case "$path" in .github/workflows/*.yml|.github/workflows/*.yaml) ;; *) exit 2 ;; esac
          [[ "${path#.github/workflows/}" != */* && -f "$path" && ! -L "$path" ]] \
            || { echo '::error::caller workflow is absent or is not a direct workflow file; source pin NOT VERIFIED'; exit 2; }
          candidates=$(yq -r '.jobs[] | select(has("uses")) | .uses' "$path") \
            || { echo '::error::caller workflow cannot be parsed; source pin NOT VERIFIED'; exit 2; }
          refs=''
          while IFS= read -r ref; do
            # Other reusable workflows do not select this gate's source.
            [[ "$ref" == */.github/workflows/"$SUITE_WORKFLOW"* ]] || continue
            case "$ref" in
              hyperpolymath/cicd-suite/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd-and-workflows/.github/workflows/"$SUITE_WORKFLOW"@*)
                repository=${ref%%/.github/workflows/*}
                sha=${ref##*@}
                [[ "$sha" =~ ^[0-9a-f]{40}$ && "$ref" == "$repository/.github/workflows/$SUITE_WORKFLOW@$sha" ]] \
                  || { echo '::error::suite caller must pin one complete 40-hex SHA; source pin NOT VERIFIED'; exit 2; }
                refs+="$repository@$sha"$'\n'
                ;;
              *) echo '::error::unexpected suite source reference; source pin NOT VERIFIED'; exit 2 ;;
            esac
          done <<< "$candidates"
          refs=$(printf '%s' "$refs" | sort -u)
          n=$(printf '%s' "$refs" | grep -c . || true)
          [[ "$n" -eq 1 ]] \
            || { echo "::error::$path selects $n distinct suite repository/commit pairs; exactly one is required. NO CHECK WAS PERFORMED."; exit 2; }
          repository=${refs%@*}
          sha=${refs##*@}
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          echo "Suite source pinned at $repository@$sha by $path"
      - name: Check out the selected suite at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse gate scripts from an unverified cicd-suite commit
        env:
          EXPECTED: ${{ steps.suite.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ steps.suite.outputs.repository }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Install Coq (Ubuntu 24.04 archive; the pin is asserted by the gate)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends coq
          coqc --version
      - name: Planted controls, then the caller's Rocq files
        env:
          ROCQ_GATE_PHASE: prove
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          FILES: ${{ inputs.files }}
          REQUIRED_THEOREMS: ${{ inputs.required_theorems }}
          ALLOWED_AXIOMS: ${{ inputs.allowed_axioms }}
        run: bash .cicd-suite/actions/rocq-check/check.sh

  verdict:
    name: Rocq verdict
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    needs: [detect, prove]
    if: ${{ always() }}
    permissions:
      contents: read
    env:
      UNITS: ${{ needs.detect.outputs.units }}
      R_DETECT: ${{ needs.detect.result }}
      R_PROVE: ${{ needs.prove.result }}
    steps:
      - name: Adjudicate
        run: |
          set -euo pipefail
          fail=0
          [ "$R_DETECT" = success ] || { echo "::error::detect: $R_DETECT"; fail=1; }
          case "$R_PROVE" in
            success) echo "  ok       prove ($UNITS unit(s))" ;;
            failure|cancelled) echo "::error::prove: $R_PROVE"; fail=1 ;;
            skipped)
              if [ "${UNITS:-0}" != 0 ] && [ -n "${UNITS:-}" ]; then
                echo "::error::prove was SKIPPED although $UNITS unit(s) exist — VOID, not green."; fail=1
              elif [ "$R_DETECT" = success ]; then
                echo "::notice::No Rocq files in this tree: nothing was checked. This verdict is silent, not green-as-assurance."
              else
                echo "::error::prove was skipped because detect did not succeed — NO CHECK WAS PERFORMED."; fail=1
              fi ;;
            *) echo "::error::prove: unknown result '$R_PROVE'"; fail=1 ;;
          esac
          [ "$fail" -eq 0 ] || { echo "::error::Rocq verdict: RED."; exit 1; }
          echo "Rocq verdict: GREEN."
