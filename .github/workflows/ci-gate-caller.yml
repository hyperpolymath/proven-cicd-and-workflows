# SPDX-License-Identifier: MPL-2.0
# CI gate — the suite gates itself with its own interim gate (dogfood). Same shape as
# templates/ci-gate-caller.yml, with two differences: the reusable is the LOCAL file
# ./.github/workflows/ci-gate.yml (so the gate runs at the suite's own default-branch commit, with no
# second pin to drift), and the context is "CI / gate", the one this repository's `main` ruleset requires.
#
# workflow_run, schedule and workflow_dispatch all run from the DEFAULT branch, so a pull request cannot
# edit this file or the profile (profiles/ci-gate/hyperpolymath/proven-cicd-and-workflows.json) that
# judges it. The pull request that first adds this file therefore never receives `CI / gate` itself and
# is merged past the gate once (docs/CI-GATE.adoc, "Bootstrap"); the gate-pr job at the end removes that need.
#
# The job id MUST stay `gate` and the workflow name MUST stay `CI gate`: the reusable drops runs of
# that name from the evaluation, and the `if:` below keeps the gate from triggering itself.
# There is deliberately NO `concurrency:` block here: the reusable's job carries the per-commit group
# (repository, context, head SHA; cancel-in-progress) so that every consumer gets it with the pin, and
# its sweep group is separate. The pull_request job at the end is permanent
# (docs/CI-GATE.adoc, "The pull_request start"); tests/ci-gate.sh pins its shape.
# `workflow_run.workflows` is an EXPLICIT list, with no globs: it is the `name:` of every workflow file in
# the profile (profiles/ci-gate/hyperpolymath/proven-cicd-and-workflows.json), so a push starts one evaluation
# per listed workflow, not one per workflow of the repository. Regenerate it whenever the profile changes:
#   scripts/ci-gate-trigger-names.sh profiles/ci-gate/hyperpolymath/proven-cicd-and-workflows.json .
# tests/ci-gate.sh pins it to that output. A required workflow missing from the list never triggers an
# evaluation (the sweep or a pull_request event still evaluates the commit; docs/CI-GATE.adoc, "Liveness").
# No `secrets:` line: the reusable consumes none.
name: CI gate

on:
  pull_request:
  workflow_run:
    workflows: ["Bounded secret scanner controls", "Central Estate CI/CD Audit", "Proven lock gate", "Secret Scanner", "Supplemental secret checks"]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  statuses: write
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  gate:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'CI gate')
    uses: ./.github/workflows/ci-gate.yml
    with:
      context: "CI / gate"

  # The pull_request start. workflow_run, schedule and workflow_dispatch run only from the default
  # branch, so without this job the pull request that adds or changes the gate never gets the status
  # and a ruleset requiring it blocks that very pull request. This job runs from the pull request's own
  # branch, posts pending, evaluates ONCE and exits: it does not wait or poll. The verdict then comes from
  # the default-branch workflow_run completions and the sweep (from a bootstrap pull request, which has
  # neither yet, re-run this workflow once the other checks have finished).
  # Same-repository branches only: a fork's or Dependabot's pull_request token cannot write statuses,
  # and those are covered by the workflow_run job. No trust decision uses github.actor.
  # Because a pull request can edit this file, the Gate tamper guard (ci-gate-tamper-guard.yml, run from
  # the default branch) fails a pull request that touches gate files unless the owner has approved it.
  gate-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci-gate.yml
    with:
      context: "CI / gate"
