# SPDX-License-Identifier: MPL-2.0
#
# Gives this repository's own pull requests the `CI / gate` commit status that its
# ruleset requires. It calls the suite's reusable ci-gate at a pinned full commit SHA
# (a reusable workflow cannot be referenced as ./ here: the lock-scope guard refuses
# unpinned local references, and a pin is what consumers do too).
#
# pull_request covers same-repository branches, including the pull request that adds
# this file: that is what makes the gate self-starting. workflow_run (runs from the
# default branch only, so it takes effect after merge) covers fork and Dependabot pull
# requests, whose pull_request token is read-only and cannot write statuses.
# No trust decision rests on github.actor or other forgeable context (Sonar S8232): a
# same-repository pull request may be evaluated by both jobs; each evaluation is fresh
# and idempotent. A Dependabot pull request makes gate-pr fail loudly (read-only token);
# gate-wr then supplies its status after merge of this file.
#
# Job id and workflow name are free; the status context comes from `with: context`,
# which must equal the spelling the ruleset requires (here with spaces: `CI / gate`).
name: CI gate caller

on:
  pull_request:
  workflow_run:
    workflows: ["**", "!CI gate caller"]
    types: [completed, in_progress]

permissions:
  statuses: write
  checks: read
  actions: read
  contents: read

jobs:
  gate-pr:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/ci-gate.yml@4e81843d4af6fa2dc54777203477ebbec0c75556
    with:
      context: "CI / gate"
  gate-wr:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.name != 'CI gate caller'
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/ci-gate.yml@4e81843d4af6fa2dc54777203477ebbec0c75556
    with:
      context: "CI / gate"
