# SPDX-License-Identifier: MPL-2.0
# CI gate — the suite gates itself with its own interim gate (dogfood). Same shape as
# templates/ci-gate-caller.yml, with two differences: the reusable is the LOCAL file
# ./.github/workflows/ci-gate.yml (so the gate runs at the suite's own default-branch commit, with no
# second pin to drift), and the context is "CI / gate", the one this repository's `main` ruleset requires.
#
# workflow_run, schedule and workflow_dispatch all run from the DEFAULT branch, so a pull request cannot
# edit this file or the profile (profiles/ci-gate/hyperpolymath/proven-cicd-and-workflows.json) that
# judges it. The pull request that first adds this file therefore never receives `CI / gate` itself and
# is merged past the gate once (docs/CI-GATE.adoc, "Bootstrap"); the gate-pr job at the end removes that need.
#
# The job id MUST stay `gate` and the workflow name MUST stay `CI gate`: the reusable drops runs of
# that name from the evaluation, and the `if:` below keeps the gate from triggering itself.
# There is deliberately NO `concurrency:` block. The pull_request job at the end is permanent
# (docs/CI-GATE.adoc, "The pull_request start"); tests/ci-gate.sh pins its shape.
# No `secrets:` line: the reusable consumes none.
name: CI gate

on:
  pull_request:
  # Only the workflows that produce the profile's required jobs start the gate (docs/CI-GATE.adoc,
  # "Fewer events"). tests/ci-gate.sh checks this list equals the names of the profile's workflows.
  workflow_run:
    workflows: ["Central Estate CI/CD Audit", "Proven lock gate", "Secret Scanner", "Bounded secret scanner controls", "Supplemental secret checks"]
    types: [completed, in_progress]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  statuses: write
  actions: read
  contents: read
  pull-requests: read

jobs:
  gate:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'CI gate')
    uses: ./.github/workflows/ci-gate.yml
    with:
      context: "CI / gate"

  # The pull_request start. workflow_run, schedule and workflow_dispatch run only from the default
  # branch, so without this job the pull request that adds or changes the gate never gets the status
  # and a ruleset requiring it blocks that very pull request. This job runs from the pull request's own
  # branch and posts the same verdict, waiting (bounded) for the checks named in the profile to report.
  # Same-repository branches only: a fork's or Dependabot's pull_request token cannot write statuses,
  # and those are covered by the workflow_run job. No trust decision uses github.actor.
  # Because a pull request can edit this file, the gate tamper guard (scripts/ci-gate-tamper-status.sh, run
  # by the `gate` job from the default branch on workflow_run and in the sweep) publishes
  # `CI/gate-tamper-guard` = failure on a pull request that touches gate files unless the owner has applied
  # the label `gate-change-approved` after its newest commit. AGENTS MUST NEVER APPLY THAT LABEL.
  gate-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci-gate.yml
    with:
      context: "CI / gate"
