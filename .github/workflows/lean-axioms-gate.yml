#
# lean-axioms-gate.yml — the Lean axiom gate for standalone (non-Lake) files,
# as a reusable workflow. Enforcing.
#
#   detect   counts the .lean sources outside any Lake project and the listed
#            files; fails when such files exist and no file is listed, or a
#            listed file does not exist
#   prove    installs Lean 4.15.0 from the upstream release archive
#            (lean-4.15.0-linux.tar.zst at its SHA-256), asserts bin/lean at
#            its SHA-256, proves the judge can say no (an axiom-free theorem
#            accepted; a sorry, Classical.choice, a declared axiom, an
#            ill-typed file and an unprinted file refused), then compiles each
#            listed file with lean and requires every `#print axioms` to report
#            "does not depend on any axioms", reports equal to prints, and
#            optionally a named set of theorems to be printed
#   verdict  one context to require; a skipped prove with sources present is
#            VOID, not green
#
# Lake projects are proof-runner-check's: it runs `lake build` and does not
# judge axioms (a sorry is a warning there). This gate judges axioms and does
# not build Lake projects. Gate scripts are pinned at the caller's own `uses:`
# SHA — see spark-gate.yml.

name: Lean Axioms Gate (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Linux x86_64 runner label (the pins are Ubuntu 24.04 builds; use ubuntu-24.04)
        type: string
        required: false
        default: ubuntu-24.04
      working_directory:
        description: Tree root
        type: string
        required: false
        default: "."
      files:
        description: Whitespace-separated standalone .lean files to compile with lean (imports limited to the toolchain's libraries)
        type: string
        required: false
        default: "verification/proofs/lean4/Haruspex.lean"
      required_theorems:
        description: Whitespace-separated theorem names that must each appear in a #print axioms; empty for none
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Every `run:` step gets bash with -e AND pipefail. GitHub's default when no
# shell is named is `bash -e` without pipefail, which would let a failing
# gate script hide behind the `| tee` that records its facts.
defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect Lean sources
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      units: ${{ steps.facts.outputs.units }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the suite repository and commit this caller pins
        id: suite
        env:
          SUITE_WORKFLOW: lean-axioms-gate.yml
        # Inside a reusable workflow the `github` context is the CALLER's, so
        # GITHUB_WORKFLOW_REF names the caller's workflow file — which is in
        # the tree just checked out and holds the very `uses:` line GitHub
        # resolved to reach this file. That SHA pins the gate scripts: one
        # pin, held by the caller, selects both the workflow and its scripts.
        # (`github.job_workflow_sha` is an OIDC claim, not a context property,
        # and reading the token would need id-token: write from every caller.)
        run: |
          set -euo pipefail
          command -v yq >/dev/null || { echo '::error::yq is unavailable; source pin NOT VERIFIED'; exit 2; }
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/"* ]] || exit 2
          path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; path="${path%@*}"
          case "$path" in .github/workflows/*.yml|.github/workflows/*.yaml) ;; *) exit 2 ;; esac
          [[ "${path#.github/workflows/}" != */* && -f "$path" && ! -L "$path" ]] \
            || { echo '::error::caller workflow is absent or is not a direct workflow file; source pin NOT VERIFIED'; exit 2; }
          candidates=$(yq -r '.jobs[] | select(has("uses")) | .uses' "$path") \
            || { echo '::error::caller workflow cannot be parsed; source pin NOT VERIFIED'; exit 2; }
          refs=''
          while IFS= read -r ref; do
            # Other reusable workflows do not select this gate's source.
            [[ "$ref" == */.github/workflows/"$SUITE_WORKFLOW"* ]] || continue
            case "$ref" in
              hyperpolymath/cicd-suite/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd-and-workflows/.github/workflows/"$SUITE_WORKFLOW"@*)
                repository=${ref%%/.github/workflows/*}
                sha=${ref##*@}
                [[ "$sha" =~ ^[0-9a-f]{40}$ && "$ref" == "$repository/.github/workflows/$SUITE_WORKFLOW@$sha" ]] \
                  || { echo '::error::suite caller must pin one complete 40-hex SHA; source pin NOT VERIFIED'; exit 2; }
                refs+="$repository@$sha"$'\n'
                ;;
              *) echo '::error::unexpected suite source reference; source pin NOT VERIFIED'; exit 2 ;;
            esac
          done <<< "$candidates"
          refs=$(printf '%s' "$refs" | sort -u)
          n=$(printf '%s' "$refs" | grep -c . || true)
          [[ "$n" -eq 1 ]] \
            || { echo "::error::$path selects $n distinct suite repository/commit pairs; exactly one is required. NO CHECK WAS PERFORMED."; exit 2; }
          repository=${refs%@*}
          sha=${refs##*@}
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          echo "Suite source pinned at $repository@$sha by $path"
      - name: Check out the selected suite at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse gate scripts from an unverified cicd-suite commit
        env:
          EXPECTED: ${{ steps.suite.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ steps.suite.outputs.repository }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Facts
        id: facts
        env:
          LEAN_GATE_PHASE: detect
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          FILES: ${{ inputs.files }}
          REQUIRED_THEOREMS: ${{ inputs.required_theorems }}
        run: bash .cicd-suite/actions/lean-axioms-check/check.sh | tee -a "$GITHUB_OUTPUT"

  prove:
    name: Lean (#print axioms)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    needs: detect
    if: ${{ needs.detect.outputs.units != '0' && needs.detect.outputs.units != '' }}
    permissions:
      contents: read
    env:
      LEAN_ARCHIVE: lean-4.15.0-linux.tar.zst
      LEAN_ARCHIVE_SHA256: af71a2569a9f68337de2434829b3008cd8e32c436e9cb6bd8c84a2c2ba3585c9
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the suite repository and commit this caller pins
        id: suite
        env:
          SUITE_WORKFLOW: lean-axioms-gate.yml
        # Inside a reusable workflow the `github` context is the CALLER's, so
        # GITHUB_WORKFLOW_REF names the caller's workflow file — which is in
        # the tree just checked out and holds the very `uses:` line GitHub
        # resolved to reach this file. That SHA pins the gate scripts: one
        # pin, held by the caller, selects both the workflow and its scripts.
        # (`github.job_workflow_sha` is an OIDC claim, not a context property,
        # and reading the token would need id-token: write from every caller.)
        run: |
          set -euo pipefail
          command -v yq >/dev/null || { echo '::error::yq is unavailable; source pin NOT VERIFIED'; exit 2; }
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/"* ]] || exit 2
          path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; path="${path%@*}"
          case "$path" in .github/workflows/*.yml|.github/workflows/*.yaml) ;; *) exit 2 ;; esac
          [[ "${path#.github/workflows/}" != */* && -f "$path" && ! -L "$path" ]] \
            || { echo '::error::caller workflow is absent or is not a direct workflow file; source pin NOT VERIFIED'; exit 2; }
          candidates=$(yq -r '.jobs[] | select(has("uses")) | .uses' "$path") \
            || { echo '::error::caller workflow cannot be parsed; source pin NOT VERIFIED'; exit 2; }
          refs=''
          while IFS= read -r ref; do
            # Other reusable workflows do not select this gate's source.
            [[ "$ref" == */.github/workflows/"$SUITE_WORKFLOW"* ]] || continue
            case "$ref" in
              hyperpolymath/cicd-suite/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd-and-workflows/.github/workflows/"$SUITE_WORKFLOW"@*)
                repository=${ref%%/.github/workflows/*}
                sha=${ref##*@}
                [[ "$sha" =~ ^[0-9a-f]{40}$ && "$ref" == "$repository/.github/workflows/$SUITE_WORKFLOW@$sha" ]] \
                  || { echo '::error::suite caller must pin one complete 40-hex SHA; source pin NOT VERIFIED'; exit 2; }
                refs+="$repository@$sha"$'\n'
                ;;
              *) echo '::error::unexpected suite source reference; source pin NOT VERIFIED'; exit 2 ;;
            esac
          done <<< "$candidates"
          refs=$(printf '%s' "$refs" | sort -u)
          n=$(printf '%s' "$refs" | grep -c . || true)
          [[ "$n" -eq 1 ]] \
            || { echo "::error::$path selects $n distinct suite repository/commit pairs; exactly one is required. NO CHECK WAS PERFORMED."; exit 2; }
          repository=${refs%@*}
          sha=${refs##*@}
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          echo "Suite source pinned at $repository@$sha by $path"
      - name: Check out the selected suite at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse gate scripts from an unverified cicd-suite commit
        env:
          EXPECTED: ${{ steps.suite.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ steps.suite.outputs.repository }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Install Lean 4.15.0 (release archive, sha256-verified)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zstd
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o "$RUNNER_TEMP/$LEAN_ARCHIVE" \
            "https://github.com/leanprover/lean4/releases/download/v4.15.0/$LEAN_ARCHIVE"
          echo "$LEAN_ARCHIVE_SHA256  $RUNNER_TEMP/$LEAN_ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/$LEAN_ARCHIVE" -C "$RUNNER_TEMP/lean"
          echo "$RUNNER_TEMP/lean/lean-4.15.0-linux/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lean/lean-4.15.0-linux/bin/lean" --version
      - name: Planted controls, then the caller's Lean files
        env:
          LEAN_GATE_PHASE: prove
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          FILES: ${{ inputs.files }}
          REQUIRED_THEOREMS: ${{ inputs.required_theorems }}
        run: bash .cicd-suite/actions/lean-axioms-check/check.sh

  verdict:
    name: Lean axioms verdict
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    needs: [detect, prove]
    if: ${{ always() }}
    permissions:
      contents: read
    env:
      UNITS: ${{ needs.detect.outputs.units }}
      R_DETECT: ${{ needs.detect.result }}
      R_PROVE: ${{ needs.prove.result }}
    steps:
      - name: Adjudicate
        run: |
          set -euo pipefail
          fail=0
          [ "$R_DETECT" = success ] || { echo "::error::detect: $R_DETECT"; fail=1; }
          case "$R_PROVE" in
            success) echo "  ok       prove ($UNITS unit(s))" ;;
            failure|cancelled) echo "::error::prove: $R_PROVE"; fail=1 ;;
            skipped)
              if [ "${UNITS:-0}" != 0 ] && [ -n "${UNITS:-}" ]; then
                echo "::error::prove was SKIPPED although $UNITS unit(s) exist — VOID, not green."; fail=1
              elif [ "$R_DETECT" = success ]; then
                echo "::notice::No Lean files in this tree: nothing was checked. This verdict is silent, not green-as-assurance."
              else
                echo "::error::prove was skipped because detect did not succeed — NO CHECK WAS PERFORMED."; fail=1
              fi ;;
            *) echo "::error::prove: unknown result '$R_PROVE'"; fail=1 ;;
          esac
          [ "$fail" -eq 0 ] || { echo "::error::Lean Axioms verdict: RED."; exit 1; }
          echo "Lean Axioms verdict: GREEN."
