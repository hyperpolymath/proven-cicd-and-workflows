#
# agda-gate.yml — the Agda kernel gate, as a reusable workflow. Enforcing.
#
#   detect   counts the .agda sources and what the MANIFEST lists; fails when
#            .agda files exist with no MANIFEST, or lie outside the proof,
#            reject and include directories
#   prove    installs Agda from the Ubuntu 24.04 archive, asserts the PINNED
#            build (agda-bin 2.6.3-1build1, /usr/bin/agda at its SHA-256),
#            proves a planted TRUE module accepted, a planted FALSE module
#            refused on its marked line and a postulate refused under --safe,
#            then checks every MANIFEST module under
#              agda --safe --without-K --cubical-compatible --no-libraries
#                   --ignore-interfaces --double-check
#            (standards PROOF-POLICY section 2.1), fails on any .agda file the
#            MANIFEST does not list, and requires every reject fixture to be
#            refused with a type error on the one line it marks
#   verdict  one context to require; a skipped prove with sources present is
#            VOID, not green
#
# Gate scripts are pinned at the caller's own `uses:` SHA — see spark-gate.yml.
# Agda comes from the Ubuntu archive, not from the caller's Guix manifest: a
# deviation under PROOF-POLICY section 6, caught by the pin assertion.

name: Agda Gate (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Linux x86_64 runner label (the pins are Ubuntu 24.04 builds; use ubuntu-24.04)
        type: string
        required: false
        default: ubuntu-24.04
      working_directory:
        description: Tree root
        type: string
        required: false
        default: "."
      manifest:
        description: "MANIFEST listing the modules to check, one per line: <source-root>|<module>|gated|quarantine|<note>"
        type: string
        required: false
        default: "verification/proofs/agda/MANIFEST"
      proof_dir:
        description: Directory scanned for .agda files the MANIFEST does not list
        type: string
        required: false
        default: "verification/proofs/agda"
      include_dirs:
        description: Whitespace-separated extra include directories (agda -i)
        type: string
        required: false
        default: "verification/proofs/agda"
      siblings_script:
        description: Caller-supplied script that fetches pinned siblings, run from the tree root before checking; empty for none
        type: string
        required: false
        default: "scripts/fetch-siblings.sh"
      siblings_include_glob:
        description: Glob of the sibling source directories the script leaves, put on the include path
        type: string
        required: false
        default: "_build/dependencies/*/src"
      reject_dir:
        description: 'Directory of fixtures that must each be refused with a type error on the line marked "-- refused here"; empty for none'
        type: string
        required: false
        default: "tests/reject"

permissions:
  contents: read

# Every `run:` step gets bash with -e AND pipefail. GitHub's default when no
# shell is named is `bash -e` without pipefail, which would let a failing
# gate script hide behind the `| tee` that records its facts.
defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect Agda sources
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      units: ${{ steps.facts.outputs.units }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the suite repository and commit this caller pins
        id: suite
        env:
          SUITE_WORKFLOW: agda-gate.yml
        # Inside a reusable workflow the `github` context is the CALLER's, so
        # GITHUB_WORKFLOW_REF names the caller's workflow file — which is in
        # the tree just checked out and holds the very `uses:` line GitHub
        # resolved to reach this file. That SHA pins the gate scripts: one
        # pin, held by the caller, selects both the workflow and its scripts.
        # (`github.job_workflow_sha` is an OIDC claim, not a context property,
        # and reading the token would need id-token: write from every caller.)
        run: |
          set -euo pipefail
          command -v yq >/dev/null || { echo '::error::yq is unavailable; source pin NOT VERIFIED'; exit 2; }
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/"* ]] || exit 2
          path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; path="${path%@*}"
          case "$path" in .github/workflows/*.yml|.github/workflows/*.yaml) ;; *) exit 2 ;; esac
          [[ "${path#.github/workflows/}" != */* && -f "$path" && ! -L "$path" ]] \
            || { echo '::error::caller workflow is absent or is not a direct workflow file; source pin NOT VERIFIED'; exit 2; }
          candidates=$(yq -r '.jobs[] | select(has("uses")) | .uses' "$path") \
            || { echo '::error::caller workflow cannot be parsed; source pin NOT VERIFIED'; exit 2; }
          refs=''
          while IFS= read -r ref; do
            # Other reusable workflows do not select this gate's source.
            [[ "$ref" == */.github/workflows/"$SUITE_WORKFLOW"* ]] || continue
            case "$ref" in
              hyperpolymath/cicd-suite/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd-and-workflows/.github/workflows/"$SUITE_WORKFLOW"@*)
                repository=${ref%%/.github/workflows/*}
                sha=${ref##*@}
                [[ "$sha" =~ ^[0-9a-f]{40}$ && "$ref" == "$repository/.github/workflows/$SUITE_WORKFLOW@$sha" ]] \
                  || { echo '::error::suite caller must pin one complete 40-hex SHA; source pin NOT VERIFIED'; exit 2; }
                refs+="$repository@$sha"$'\n'
                ;;
              *) echo '::error::unexpected suite source reference; source pin NOT VERIFIED'; exit 2 ;;
            esac
          done <<< "$candidates"
          refs=$(printf '%s' "$refs" | sort -u)
          n=$(printf '%s' "$refs" | grep -c . || true)
          [[ "$n" -eq 1 ]] \
            || { echo "::error::$path selects $n distinct suite repository/commit pairs; exactly one is required. NO CHECK WAS PERFORMED."; exit 2; }
          repository=${refs%@*}
          sha=${refs##*@}
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          echo "Suite source pinned at $repository@$sha by $path"
      - name: Check out the selected suite at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse gate scripts from an unverified cicd-suite commit
        env:
          EXPECTED: ${{ steps.suite.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ steps.suite.outputs.repository }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Facts
        id: facts
        env:
          AGDA_GATE_PHASE: detect
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          MANIFEST: ${{ inputs.manifest }}
          PROOF_DIR: ${{ inputs.proof_dir }}
          INCLUDE_DIRS: ${{ inputs.include_dirs }}
          SIBLINGS_SCRIPT: ${{ inputs.siblings_script }}
          SIBLINGS_INCLUDE_GLOB: ${{ inputs.siblings_include_glob }}
          REJECT_DIR: ${{ inputs.reject_dir }}
        run: bash .cicd-suite/actions/agda-check/check.sh | tee -a "$GITHUB_OUTPUT"

  prove:
    name: Agda kernel check
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    needs: detect
    if: ${{ needs.detect.outputs.units != '0' && needs.detect.outputs.units != '' }}
    permissions:
      contents: read
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the suite repository and commit this caller pins
        id: suite
        env:
          SUITE_WORKFLOW: agda-gate.yml
        # Inside a reusable workflow the `github` context is the CALLER's, so
        # GITHUB_WORKFLOW_REF names the caller's workflow file — which is in
        # the tree just checked out and holds the very `uses:` line GitHub
        # resolved to reach this file. That SHA pins the gate scripts: one
        # pin, held by the caller, selects both the workflow and its scripts.
        # (`github.job_workflow_sha` is an OIDC claim, not a context property,
        # and reading the token would need id-token: write from every caller.)
        run: |
          set -euo pipefail
          command -v yq >/dev/null || { echo '::error::yq is unavailable; source pin NOT VERIFIED'; exit 2; }
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/"* ]] || exit 2
          path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; path="${path%@*}"
          case "$path" in .github/workflows/*.yml|.github/workflows/*.yaml) ;; *) exit 2 ;; esac
          [[ "${path#.github/workflows/}" != */* && -f "$path" && ! -L "$path" ]] \
            || { echo '::error::caller workflow is absent or is not a direct workflow file; source pin NOT VERIFIED'; exit 2; }
          candidates=$(yq -r '.jobs[] | select(has("uses")) | .uses' "$path") \
            || { echo '::error::caller workflow cannot be parsed; source pin NOT VERIFIED'; exit 2; }
          refs=''
          while IFS= read -r ref; do
            # Other reusable workflows do not select this gate's source.
            [[ "$ref" == */.github/workflows/"$SUITE_WORKFLOW"* ]] || continue
            case "$ref" in
              hyperpolymath/cicd-suite/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd-and-workflows/.github/workflows/"$SUITE_WORKFLOW"@*)
                repository=${ref%%/.github/workflows/*}
                sha=${ref##*@}
                [[ "$sha" =~ ^[0-9a-f]{40}$ && "$ref" == "$repository/.github/workflows/$SUITE_WORKFLOW@$sha" ]] \
                  || { echo '::error::suite caller must pin one complete 40-hex SHA; source pin NOT VERIFIED'; exit 2; }
                refs+="$repository@$sha"$'\n'
                ;;
              *) echo '::error::unexpected suite source reference; source pin NOT VERIFIED'; exit 2 ;;
            esac
          done <<< "$candidates"
          refs=$(printf '%s' "$refs" | sort -u)
          n=$(printf '%s' "$refs" | grep -c . || true)
          [[ "$n" -eq 1 ]] \
            || { echo "::error::$path selects $n distinct suite repository/commit pairs; exactly one is required. NO CHECK WAS PERFORMED."; exit 2; }
          repository=${refs%@*}
          sha=${refs##*@}
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          echo "Suite source pinned at $repository@$sha by $path"
      - name: Check out the selected suite at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse gate scripts from an unverified cicd-suite commit
        env:
          EXPECTED: ${{ steps.suite.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ steps.suite.outputs.repository }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Install Agda (Ubuntu 24.04 archive; the pin is asserted by the gate)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends agda-bin
          agda --version
      - name: Planted controls, then the caller's Agda modules
        env:
          AGDA_GATE_PHASE: prove
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          MANIFEST: ${{ inputs.manifest }}
          PROOF_DIR: ${{ inputs.proof_dir }}
          INCLUDE_DIRS: ${{ inputs.include_dirs }}
          SIBLINGS_SCRIPT: ${{ inputs.siblings_script }}
          SIBLINGS_INCLUDE_GLOB: ${{ inputs.siblings_include_glob }}
          REJECT_DIR: ${{ inputs.reject_dir }}
        run: bash .cicd-suite/actions/agda-check/check.sh

  verdict:
    name: Agda verdict
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    needs: [detect, prove]
    if: ${{ always() }}
    permissions:
      contents: read
    env:
      UNITS: ${{ needs.detect.outputs.units }}
      R_DETECT: ${{ needs.detect.result }}
      R_PROVE: ${{ needs.prove.result }}
    steps:
      - name: Adjudicate
        run: |
          set -euo pipefail
          fail=0
          [ "$R_DETECT" = success ] || { echo "::error::detect: $R_DETECT"; fail=1; }
          case "$R_PROVE" in
            success) echo "  ok       prove ($UNITS unit(s))" ;;
            failure|cancelled) echo "::error::prove: $R_PROVE"; fail=1 ;;
            skipped)
              if [ "${UNITS:-0}" != 0 ] && [ -n "${UNITS:-}" ]; then
                echo "::error::prove was SKIPPED although $UNITS unit(s) exist — VOID, not green."; fail=1
              elif [ "$R_DETECT" = success ]; then
                echo "::notice::No Agda modules in this tree: nothing was checked. This verdict is silent, not green-as-assurance."
              else
                echo "::error::prove was skipped because detect did not succeed — NO CHECK WAS PERFORMED."; fail=1
              fi ;;
            *) echo "::error::prove: unknown result '$R_PROVE'"; fail=1 ;;
          esac
          [ "$fail" -eq 0 ] || { echo "::error::Agda verdict: RED."; exit 1; }
          echo "Agda verdict: GREEN."
