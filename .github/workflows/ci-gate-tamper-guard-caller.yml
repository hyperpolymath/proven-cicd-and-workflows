# SPDX-License-Identifier: MPL-2.0
# Gate tamper guard - the suite guards its own gate files. pull_request_target runs this file from the
# DEFAULT branch, so a pull request cannot edit it; the job never checks out or runs pull request code
# (it reads the changed-file list through the API). Local reusable, like ci-gate-caller.yml.
# A pull request that touches gate files fails this check until the OWNER applies the label
# `gate-change-approved` after the newest commit. AGENTS MUST NEVER APPLY THAT LABEL.
# No `secrets:` line, minimal permissions. See docs/CI-GATE.adoc, "Tamper guard".
name: Gate tamper guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read
  contents: read

jobs:
  guard:
    uses: ./.github/workflows/ci-gate-tamper-guard.yml
