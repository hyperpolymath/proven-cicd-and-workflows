#
# ci-gate.yml — the interim `CI/gate`, as a reusable workflow. See docs/CI-GATE.adoc.
#
# It publishes ONE commit status (context = `inputs.context`, default `CI/gate`) on the head
# commit of the workflow run (or pull request) that triggered it. The verdict is a pure script
# (scripts/ci-gate-verdict.sh) over the required-check list for the calling repository
# (profiles/ci-gate/<owner>/<repo>.json) and the Actions check runs (latest attempt) of that commit.
#
# CALL BUDGET: an evaluation reads the commit with TWO requests however many workflows it has: the
# workflow runs of the head SHA, and the latest check runs of the commit, joined on check suite id
# (scripts/ci-gate-lib.sh, profiles/ci-gate/join-checks.jq). It never lists the jobs of each run.
#
# COALESCING: the job has a `concurrency` group keyed on repository, context and head SHA with
# cancel-in-progress, so the newest event for a commit replaces any evaluation still queued or
# running for it. The sweep has its own group and is neither cancelled by nor cancelling those.
#
# WHY A COMMIT STATUS: a job inside a reusable workflow gets the check-run name
# `<caller job> / <called job>`, which always contains " / " and so can never equal `CI/gate`.
#
# WHY workflow_run: GitHub runs a workflow_run workflow from the DEFAULT branch, so a pull
# request cannot edit the caller, its pin, or its list. Each COMPLETED workflow re-evaluates the head
# commit; there is no polling and no wait. The pull_request start (gate-pr) evaluates once and exits.
#
# SAFETY — this workflow never checks out, builds or executes code from the consumer
# repository or the pull request (the pwn-request hazard of workflow_run). It reads only
# metadata through the API, and it fetches its own profile and scripts from THIS repository
# at the commit it was called at (`job.workflow_sha`), never from the consumer. Every
# `${{ }}` value reaches a script through `env:`, never inline into `run:`. It uses no
# actions, so there is nothing to pin: `gh` and `jq` ship on the runner image.
#
# SWEEP: on `schedule` and `workflow_dispatch` there is no triggering run, so the job instead lists the
# open pull requests and the default branch head of `github.repository` and runs the same guarded
# publisher on each distinct head SHA (scripts/ci-gate-sweep.sh). That bounds
# nothing by itself: a sweep is one more last-writer-wins evaluator (docs/CI-GATE.adoc, "Residual limit").
#
# FAIL CLOSED, NEVER FAIL ON AN UNAVAILABLE API: a missing or invalid profile, an empty
# `job.workflow_sha`, a real API error (a 4xx that is not a rate limit), or any event other than
# workflow_run, pull_request, schedule or workflow_dispatch is a failure, never a pass or a pending.
# A rate-limited or unavailable GitHub API (429, a 403 that says rate limit, a 5xx, no answer) is
# retried with back-off and then published as `pending` "re-evaluating later": never as a failure.
#
# The caller must grant: statuses: write, actions: read, checks: read, contents: read,
# pull-requests: read (the last one is read only by the sweep, to list open pull requests).
# No `secrets:` — the reusable consumes none.

name: CI gate (reusable)

on:
  workflow_call:
    inputs:
      context:
        description: The commit-status context to publish (the one swappable name)
        type: string
        required: false
        default: CI/gate
      timeout_minutes:
        description: How long a missing or running required check may keep the gate pending
        type: number
        required: false
        default: 180
      wait_minutes:
        description: DEPRECATED and IGNORED. The pull_request start no longer waits or polls (it evaluates once; the verdict comes from workflow_run completions and the sweep). Accepted so that pinned callers keep working.
        type: number
        required: false
        default: 30
      poll_seconds:
        description: DEPRECATED and IGNORED, like wait_minutes. Accepted so that pinned callers keep working.
        type: number
        required: false
        default: 20

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One evaluation per commit at a time; the newest event replaces older ones. workflow_run and
    # pull_request share the key of their head SHA. A schedule or workflow_dispatch sweep has the key
    # "sweep" (no commit has that name), and is never cancelled: a sweep that runs longer than the
    # cron interval would otherwise be cancelled by the next one and never finish.
    concurrency:
      group: ci-gate-${{ github.repository }}-${{ inputs.context }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || 'sweep' }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' || github.event_name == 'pull_request' }}
    permissions:
      statuses: write
      actions: read
      checks: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
      CONTEXT: ${{ inputs.context }}
      TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      GATE_NAME: ${{ github.workflow }}
      SERVER_URL: ${{ github.server_url }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Read the gate library from this suite at its own commit
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        # job.workflow_repository / job.workflow_sha name the reusable workflow file's own
        # repository and commit. Empty means the runner cannot say: fail, do not guess.
        # This one request cannot go through the library it is fetching, so it carries its own small
        # bounded retry for a rate limit or a server error. If it still fails, no status is written at
        # all (the job is red): nothing can be published without the library, and this gate never
        # posts a failure for an unavailable API.
        run: |
          set -euo pipefail
          [[ "$WF_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ && "${WF_REPO#*/}" != . && "${WF_REPO#*/}" != .. ]] \
            || { echo "::error::job.workflow_repository is empty or malformed ('$WF_REPO'); no profile can be pinned. NO CHECK WAS PERFORMED."; exit 1; }
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::job.workflow_sha is empty or not a 40-hex commit ('$WF_SHA'); no profile can be pinned. NO CHECK WAS PERFORMED."; exit 1; }
          suite="$RUNNER_TEMP/ci-gate-suite"
          rm -rf "$suite"; mkdir -p "$suite/scripts" "$suite/profiles/ci-gate"
          err="$RUNNER_TEMP/ci-gate-lib.err"
          delay=5; got=0
          for attempt in 1 2 3 4 5; do
            # gh writes the JSON body of an error response to stdout too, so success is the exit status, not a non-empty file
            if gh api -H 'Accept: application/vnd.github.raw+json' "repos/$WF_REPO/contents/scripts/ci-gate-lib.sh?ref=$WF_SHA" > "$suite/scripts/ci-gate-lib.sh" 2> "$err"; then
              got=1; break
            fi
            if ((attempt < 5)) && grep -qiE 'rate limit|HTTP (429|500|502|503|504)|timeout|connection|EOF' "$err"; then
              echo "scripts/ci-gate-lib.sh: transient API error (attempt $attempt); retrying in ${delay}s"
              sleep "$delay"; delay=$((delay * 2)); continue
            fi
            break
          done
          if ((got != 1)) || [[ ! -s "$suite/scripts/ci-gate-lib.sh" ]]; then
            cat "$err" >&2
            echo "::error::could not read scripts/ci-gate-lib.sh from $WF_REPO@$WF_SHA; NO STATUS WAS WRITTEN"
            exit 1
          fi
          echo "suite=$suite" >> "$GITHUB_ENV"
      - name: Refuse anything but a workflow_run, pull_request, schedule or workflow_dispatch event
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run | pull_request | schedule | workflow_dispatch) ;;
            *) echo "::error::ci-gate runs only on workflow_run, pull_request, schedule and workflow_dispatch (got '$EVENT_NAME'); NO VERDICT WAS PRODUCED"; exit 1 ;;
          esac
          if [[ "$EVENT_NAME" == workflow_run || "$EVENT_NAME" == pull_request ]]; then
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::workflow_run head sha is not a 40-hex commit; NO VERDICT WAS PRODUCED"; exit 1; }
          fi
          [[ "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ && "${REPO#*/}" != . && "${REPO#*/}" != .. ]] \
            || { echo "::error::repository name is not an owner/name coordinate"; exit 1; }
          # Context: 1 to 128 characters, alphanumeric first, then [A-Za-z0-9._/-] with single interior
          # spaces (no leading, trailing or repeated space, no tab or newline). The regex alone would
          # allow 255 characters (each repeat may be a space plus a character), so the length is
          # checked as well. The failure step below repeats this guard byte for byte.
          ctx_re='^[A-Za-z0-9]([A-Za-z0-9._/-]| [A-Za-z0-9._/-]){0,127}$'
          [[ ${#CONTEXT} -le 128 && $CONTEXT =~ $ctx_re ]] \
            || { echo "::error::context input is empty or has unexpected characters"; exit 1; }
          [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::timeout_minutes must be a positive integer"; exit 1; }
      - name: Read the profile and the verdict scripts from this suite at its own commit
        id: read
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        # The profile selected by github.repository is read at the SHA the caller pinned. A rate-limited
        # or unavailable API (after the library's back-off) publishes `pending`, not a failure, and the
        # later steps are skipped; a missing profile or any real error is a failure (the fallback step).
        run: |
          set -uo pipefail
          # shellcheck source=/dev/null
          source "$suite/scripts/ci-gate-lib.sh"
          fetch() { # <path in the suite> -> same path under $suite; refuses an empty file
            local rc=0
            gate_fetch "$WF_REPO" "$1" "$WF_SHA" "$suite/$1" || rc=$?
            case $rc in
              0) return 0 ;;
              75)
                echo "unavailable=true" >> "$GITHUB_OUTPUT"
                if [[ "$EVENT_NAME" == workflow_run || "$EVENT_NAME" == pull_request ]]; then
                  echo "::warning::GitHub API rate-limited or unavailable while reading $1 ($GATE_API_ERR); publishing pending, NOT failure"
                  gate_post_unavailable "$REPO" "$HEAD_SHA" "$CONTEXT" "$SERVER_URL/$REPO/actions/runs/$RUN_ID" \
                    || { echo "::error::could not write the pending status either ($GATE_API_ERR); NO STATUS WAS WRITTEN and NO FAILURE WAS POSTED"; exit 1; }
                  exit 0
                fi
                echo "::error::GitHub API rate-limited or unavailable while reading $1 ($GATE_API_ERR); the sweep evaluated nothing"
                exit 1 ;;
              *) echo "::error::could not read $1 from $WF_REPO@$WF_SHA ($GATE_API_ERR)"; return 1 ;;
            esac
          }
          fetch scripts/ci-gate-verdict.sh || exit 1
          fetch scripts/validate-ci-gate-profile.sh || exit 1
          fetch scripts/ci-gate-publish.sh || exit 1
          fetch scripts/ci-gate-sweep.sh || exit 1
          fetch profiles/ci-gate/validate.jq || exit 1
          fetch profiles/ci-gate/select-runs.jq || exit 1
          fetch profiles/ci-gate/join-checks.jq || exit 1
          mkdir -p "$suite/profiles/ci-gate/${REPO%%/*}"
          fetch "profiles/ci-gate/$REPO.json" \
            || { echo "::error::no readable CI/gate profile for $REPO at $WF_REPO@$WF_SHA; add profiles/ci-gate/$REPO.json to the suite. The gate fails closed without one."; exit 1; }
          echo "Profile for $REPO read from $WF_REPO@$WF_SHA"
      - name: Validate the profile
        if: ${{ steps.read.outputs.unavailable != 'true' }}
        run: bash "$suite/scripts/validate-ci-gate-profile.sh" "$suite/profiles/ci-gate/$REPO.json" "$REPO" "$CONTEXT"
      - name: Evaluate the commit and publish the status
        id: publish
        if: ${{ steps.read.outputs.unavailable != 'true' }}
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        # All of the reading, the settle guard and the publishing is scripts/ci-gate-publish.sh
        # (fetched from the suite above), so a stub `gh` can test it offline. On workflow_run it
        # evaluates once and exits; on pull_request it first writes one pending (EVENT_NAME), then
        # evaluates once and exits: it never waits or polls. On schedule and workflow_dispatch
        # scripts/ci-gate-sweep.sh runs that same publisher once per open pull request head and the
        # default branch head. The workflow only hands them values through env.
        # Exit 75 of the publisher means the GitHub API was unavailable and `pending` was written:
        # a warning, not a red job and never a failure status.
        run: |
          set -uo pipefail
          rc=0
          if [[ "$EVENT_NAME" == workflow_run || "$EVENT_NAME" == pull_request ]]; then
            SUITE="$suite" WORK="$RUNNER_TEMP/ci-gate-work" bash "$suite/scripts/ci-gate-publish.sh" || rc=$?
            if ((rc == 75)); then
              echo "::warning::GitHub API rate-limited or unavailable; CI/gate was set to pending and will be re-evaluated by the next workflow_run completion or the sweep. No failure was posted."
              rc=0
            fi
          else
            SUITE="$suite" WORK="$RUNNER_TEMP/ci-gate-sweep" bash "$suite/scripts/ci-gate-sweep.sh" || rc=$?
          fi
          exit "$rc"
      - name: Publish a failure status when no verdict could be produced
        if: ${{ failure() && steps.publish.outputs.published != 'true' && steps.publish.outputs.unavailable != 'true' && steps.read.outputs.unavailable != 'true' }}
        # Only for a real fail-closed cause (a missing or invalid profile, an input error, a real API
        # error): never for an unavailable API, which the steps above publish as pending.
        run: |
          set -uo pipefail
          ctx_re='^[A-Za-z0-9]([A-Za-z0-9._/-]| [A-Za-z0-9._/-]){0,127}$'
          [[ ( $EVENT_NAME == workflow_run || $EVENT_NAME == pull_request ) && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && ${#CONTEXT} -le 128 && $CONTEXT =~ $ctx_re ]] || exit 0
          [[ -f "${suite:-/nonexistent}/scripts/ci-gate-lib.sh" ]] \
            || { echo "::error::the gate library was not read; NO STATUS WAS WRITTEN"; exit 1; }
          # shellcheck source=/dev/null
          source "$suite/scripts/ci-gate-lib.sh"
          gate_post "$REPO" "$HEAD_SHA" "$CONTEXT" failure \
            'ci-gate could not produce a verdict (profile or input error); see the run' \
            "$SERVER_URL/$REPO/actions/runs/$RUN_ID" > /dev/null \
            || echo "::warning::could not publish the failure status either ($GATE_API_ERR)"
