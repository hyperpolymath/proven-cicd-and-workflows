#
# ci-gate.yml — the interim `CI/gate`, as a reusable workflow. See docs/CI-GATE.adoc.
#
# It publishes ONE commit status (context = `inputs.context`, default `CI/gate`) on the head
# commit of the workflow run that triggered it. The verdict is a pure script
# (scripts/ci-gate-verdict.sh) over the required-check list for the calling repository
# (profiles/ci-gate/<owner>/<repo>.json) and the Actions jobs (latest attempt) of that commit's workflow runs.
#
# WHY A COMMIT STATUS: a job inside a reusable workflow gets the check-run name
# `<caller job> / <called job>`, which always contains " / " and so can never equal `CI/gate`.
#
# WHY workflow_run: GitHub runs a workflow_run workflow from the DEFAULT branch, so a pull
# request cannot edit the caller, its pin, or its list. Each started or completed workflow re-evaluates
# the head commit; there is no polling.
#
# SAFETY — this workflow never checks out, builds or executes code from the consumer
# repository or the pull request (the pwn-request hazard of workflow_run). It reads only
# metadata through the API, and it fetches its own profile and scripts from THIS repository
# at the commit it was called at (`job.workflow_sha`), never from the consumer. Every
# `${{ }}` value reaches a script through `env:`, never inline into `run:`. It uses no
# actions, so there is nothing to pin: `gh` and `jq` ship on the runner image.
#
# SWEEP: on `schedule` and `workflow_dispatch` there is no triggering run, so the job instead lists the
# open pull requests and the default branch head of `github.repository` and runs the same guarded
# publisher on each distinct head SHA (scripts/ci-gate-sweep.sh), with no early pending. That bounds
# nothing by itself: a sweep is one more last-writer-wins evaluator (docs/CI-GATE.adoc, "Residual limit").
#
# FAIL CLOSED: a missing or invalid profile, an empty `job.workflow_sha`, any API error, or
# any event other than workflow_run, schedule or workflow_dispatch is a failure, never a pass or a pending.
#
# REST LAYER AND STATUS WRITES: every API read and every commit status (the early pending, the
# verdicts, the failure fallback) goes through ONE layer, scripts/ci-gate-api.sh, written by the
# "Write the REST layer" step and sourced by the others and by scripts/ci-gate-publish.sh. Reads are
# conditional (ETag; a 304 is free) and paged. A rate-limited request (HTTP 429, or 403 with a
# rate-limit answer) waits for Retry-After, else for x-ratelimit-reset when the quota is spent, else a
# capped exponential back-off with jitter; at most 5 attempts per request and 300 s of waiting per job
# in all. Exhausted, it fails with "rate limited, no verdict". The writer skips a write that repeats the
# status already standing for the context (GitHub keeps at most 1000 statuses per SHA and context).
#
# CONCURRENCY: one evaluation per repository, context and head SHA at a time (pull_request apart from
# the others); a newer event for the same SHA cancels the running one, which re-reads everything
# anyway. Schedule and workflow_dispatch sweeps are keyed by run, so they never cancel each other.
# Callers can cut events further by naming their workflows in `workflow_run.workflows` instead of
# "**" (docs/CI-GATE.adoc, "REST budget and rate limits").
#
# The caller must grant: statuses: write, actions: read, contents: read, pull-requests: read
# (the last one is read only by the sweep, to list open pull requests).
# No `secrets:` — the reusable consumes none.

name: CI gate (reusable)

on:
  workflow_call:
    inputs:
      context:
        description: The commit-status context to publish (the one swappable name)
        type: string
        required: false
        default: CI/gate
      timeout_minutes:
        description: How long a missing or running required check may keep the gate pending
        type: number
        required: false
        default: 180
      wait_minutes:
        description: pull_request only. Maximum 50 minutes (reserves 10 minutes of the job timeout). How long to keep polling while a required check has not reported or a run is still active, before failing. Ignored on every other event.
        type: number
        required: false
        default: 30
      poll_seconds:
        description: pull_request only. Seconds between polls.
        type: number
        required: false
        default: 20
      quiet_seconds:
        description: workflow_run only. Seconds to wait, after the early pending and before the first read, so a newer event for the same commit cancels this run before it spends API calls. 0 to 120.
        type: number
        required: false
        default: 30

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ci-gate|${{ github.repository }}|${{ inputs.context }}|${{ github.event_name == 'pull_request' && 'pr' || 'run' }}|${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
      cancel-in-progress: true
    permissions:
      statuses: write
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
      CONTEXT: ${{ inputs.context }}
      TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      WAIT_MINUTES: ${{ inputs.wait_minutes }}
      POLL_SECONDS: ${{ inputs.poll_seconds }}
      QUIET_SECONDS: ${{ inputs.quiet_seconds }}
      GATE_NAME: ${{ github.workflow }}
      SERVER_URL: ${{ github.server_url }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Refuse anything but a workflow_run, schedule or workflow_dispatch event
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run | pull_request | schedule | workflow_dispatch) ;;
            *) echo "::error::ci-gate runs only on workflow_run, pull_request, schedule and workflow_dispatch (got '$EVENT_NAME'); NO VERDICT WAS PRODUCED"; exit 1 ;;
          esac
          if [[ "$EVENT_NAME" == workflow_run || "$EVENT_NAME" == pull_request ]]; then
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::workflow_run head sha is not a 40-hex commit; NO VERDICT WAS PRODUCED"; exit 1; }
          fi
          [[ "$REPO" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ && "${REPO#*/}" != . && "${REPO#*/}" != .. ]] \
            || { echo "::error::repository name is not an owner/name coordinate"; exit 1; }
          # Context: 1 to 128 characters, alphanumeric first, then [A-Za-z0-9._/-] with single interior
          # spaces (no leading, trailing or repeated space, no tab or newline). The regex alone would
          # allow 255 characters (each repeat may be a space plus a character), so the length is
          # checked as well. The failure step below repeats this guard byte for byte.
          ctx_re='^[A-Za-z0-9]([A-Za-z0-9._/-]| [A-Za-z0-9._/-]){0,127}$'
          [[ ${#CONTEXT} -le 128 && $CONTEXT =~ $ctx_re ]] \
            || { echo "::error::context input is empty or has unexpected characters"; exit 1; }
          [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::timeout_minutes must be a positive integer"; exit 1; }
          [[ "$WAIT_MINUTES" =~ ^[0-9]+$ && "$POLL_SECONDS" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::wait_minutes must be a non-negative and poll_seconds a positive integer"; exit 1; }
          [[ "$QUIET_SECONDS" =~ ^[0-9]+$ && ${#QUIET_SECONDS} -le 3 ]] && ((10#$QUIET_SECONDS <= 120)) \
            || { echo "::error::quiet_seconds must be an integer from 0 to 120"; exit 1; }
          # Reserve ten minutes of the 60-minute job for setup and final publication.
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ ${#WAIT_MINUTES} -le 2 ]] && ((10#$WAIT_MINUTES <= 50)) \
              || { echo "::error::wait_minutes must be at most 50 to fit the job timeout"; exit 1; }
          fi
      - name: Write the REST layer
        # Local only: no API call and no suite file, so the early pending below still runs first.
        # One copy of the REST layer for the whole job (reads, retries, the status writer); this text is
        # scripts/ci-gate-api.sh byte for byte, and tests/ci-gate.sh extracts and drives it.
        run: |
          set -euo pipefail
          lib="$RUNNER_TEMP/ci-gate-api.sh"
          cat > "$lib" <<'CI_GATE_STATUS_EOF'
          # shellcheck shell=bash
          # SPDX-License-Identifier: MPL-2.0
          #
          # ci-gate-api.sh - the CI gate's ONE REST layer: conditional reads, page walking, bounded back-off on
          # rate limits, and the status writer. SOURCED, never run. It talks to GitHub only through `gh api -i`
          # on PATH, so a stub can drive it (tests/ci-gate.sh, tests/ci-gate-api-budget.sh).
          #
          # Shipped text: .github/workflows/ci-gate.yml writes this file's text, byte for byte, in its step
          # "Write the REST layer" (the first step that touches the API, before any suite file is fetched), and
          # every later step, the publisher and the sweep source that copy through CI_GATE_STATUS_LIB.
          # tests/ci-gate.sh fails when the two texts differ.
          #
          # Why: the GITHUB_TOKEN of a repository has a REST budget per hour (1000 on github.com), shared by every
          # workflow in that repository. The gate re-reads the same lists many times per evaluation (snapshot,
          # settle guard, post-write verify, every pull_request poll), and an exhausted budget made it publish
          # NO VERDICT ("API rate limit exceeded for installation", HTTP 403). Two measures, no change of meaning:
          #
          #  1. Conditional reads. Every GET page is sent with the ETag of the last answer for the same URL in
          #     this job (If-None-Match). An unchanged page answers 304, which GitHub does not count against the
          #     primary rate limit; the cached body is used. Pages are walked by `page=N` while the answer carries
          #     a Link rel="next"; more than API_MAX_PAGES pages fails closed.
          #  2. Back-off, for reads and writes alike. HTTP 429, or 403 with a rate-limit signal
          #     (X-RateLimit-Remaining: 0, a Retry-After header, or a body that says "rate limit"), is retried:
          #     after Retry-After seconds, else after the primary reset (X-RateLimit-Reset), else a capped
          #     exponential wait with jitter (60, 120, 240 s, then 240, plus up to half again). At most
          #     API_MAX_ATTEMPTS tries per request, and at most API_RETRY_BUDGET_SECONDS of waiting in all, kept
          #     in API_RETRY_LEDGER so that every step of a job, and every head of a sweep, spends one budget.
          #     Past either limit the call FAILS with "rate limited, no verdict", and the caller fails closed: no
          #     verdict is a failure, never a pass. Any other error is not retried.
          #
          # post_status is the only writer of commit statuses (the early pending, the verdicts, the failure
          # fallback). It skips a write that repeats the status already standing for the context (same state and
          # description; GitHub keeps at most 1000 statuses per SHA and context), and returns 0 written or
          # skipped, 1 refused, 2 rate limited. A rate-limited POST that gave up sets CI_GATE_RATE_LIMITED=1,
          # which the publisher's die() reads: a failure write would meet the same limit, so it writes nothing.
          #
          # Environment:
          #   REPO HEAD_SHA CONTEXT SERVER_URL RUN_ID   what post_status writes (the sourcing step sets them)
          #   API_CACHE                 directory for ETags, bodies and the ledger
          #                             (default: ${WORK:-${RUNNER_TEMP:-a fresh mktemp -d}}/api-cache)
          #   API_RETRY_BUDGET_SECONDS  total seconds this job may spend waiting on rate limits (default 300)
          #   API_RETRY_LEDGER          file holding the seconds already spent (default: $API_CACHE/ledger)
          #   API_MAX_ATTEMPTS          tries per request, the first included (default 5)
          #   API_MAX_PAGES             page cap per list (default 50)
          #   CI_GATE_SLEEP CI_GATE_CLOCK   test hooks: the sleep command, a date command called with +%s
          #   API_STATS                 optional file: one line per request, "<code> <method> <path>"

          if [[ -z ${API_CACHE:-} ]]; then
            if [[ -n ${WORK:-} ]]; then API_CACHE=$WORK/api-cache
            elif [[ -n ${RUNNER_TEMP:-} ]]; then API_CACHE=$RUNNER_TEMP/api-cache
            else API_CACHE=$(mktemp -d) || return 1
            fi
          fi
          API_RETRY_BUDGET_SECONDS=${API_RETRY_BUDGET_SECONDS:-300}
          API_MAX_ATTEMPTS=${API_MAX_ATTEMPTS:-5}
          API_MAX_PAGES=${API_MAX_PAGES:-50}
          mkdir -p "$API_CACHE" || return 1
          API_RETRY_LEDGER=${API_RETRY_LEDGER:-$API_CACHE/ledger}
          [[ $API_RETRY_BUDGET_SECONDS =~ ^[0-9]{1,6}$ && $API_MAX_ATTEMPTS =~ ^[1-9][0-9]?$ && $API_MAX_PAGES =~ ^[1-9][0-9]{0,5}$ ]] \
            || { echo "::error::ci-gate-api: API_RETRY_BUDGET_SECONDS / API_MAX_ATTEMPTS / API_MAX_PAGES malformed" >&2; return 1; }
          # Base 10 always: a leading zero (0300) must not be read as octal in the arithmetic below.
          API_RETRY_BUDGET_SECONDS=$((10#$API_RETRY_BUDGET_SECONDS)); API_MAX_ATTEMPTS=$((10#$API_MAX_ATTEMPTS)); API_MAX_PAGES=$((10#$API_MAX_PAGES))
          # Read by the caller: ci-gate-publish.sh die() exits without reposting.
          # shellcheck disable=SC2034
          CI_GATE_RATE_LIMITED=0

          api_now() { "${CI_GATE_CLOCK:-date}" +%s; }

          # <raw file> -> $API_CODE and $API_HDR (headers, CR stripped) and $API_BODY_RAW (body file).
          # `gh api -i` prints the status line and headers, a blank line, then the body; on an HTTP error it
          # still prints them and exits non-zero, so the exit code is not used, only the status line.
          api_split() {
            local raw=$1
            API_HDR="$raw.hdr"; API_BODY_RAW="$raw.body"
            awk -v h="$API_HDR" -v b="$API_BODY_RAW" 'BEGIN { printf "" > h; printf "" > b }
              !done { sub(/\r$/, ""); if ($0 == "") { if (seen) done = 1; next } if ($0 ~ /^HTTP\//) { seen = 1; printf "" > h } print > h; next }
              { print > b }' "$raw"
            API_CODE=$(awk 'NR == 1 && /^HTTP\// { print $2 }' "$API_HDR")
            [[ $API_CODE =~ ^[0-9]{3}$ ]] || API_CODE=000
          }
          api_header() { # <name, case-insensitive> -> value of the last such header in $API_HDR
            awk -v n="$(tr '[:upper:]' '[:lower:]' <<< "$1")" 'BEGIN { FS = ": *" } { k = tolower($1) } k == n { v = substr($0, index($0, ":") + 1); sub(/^ +/, "", v) } END { print v }' "$API_HDR"
          }

          # A 429 is a rate limit. A 403 is one only with a rate-limit signal; a plain 403 (a missing permission) is not.
          api_is_rate_limited() { # <stderr file>
            [[ $API_CODE == 429 ]] && return 0
            [[ $API_CODE == 403 ]] || return 1
            [[ $(api_header x-ratelimit-remaining) == 0 || -n $(api_header retry-after) ]] && return 0
            grep -qiE 'rate limit' "$API_BODY_RAW" "$1" 2> /dev/null
          }

          api_backoff() { # <attempt> <method> <path> -> sleeps and returns 0, or returns 1 when the attempts or the budget are spent
            local attempt=$1 wait ra reset spent now
            ra=$(api_header retry-after); reset=$(api_header x-ratelimit-reset); now=$(api_now)
            if [[ $ra =~ ^[0-9]{1,6}$ ]]; then wait=$((10#$ra))
            elif [[ $(api_header x-ratelimit-remaining) == 0 && $reset =~ ^[0-9]{1,12}$ ]]; then wait=$((10#$reset - now + 1))
            else
              # A secondary limit with no header: GitHub says wait at least a minute, so start there and grow.
              # Cap before shifting: 60 << 58 overflows, and API_MAX_ATTEMPTS may be set as high as 99.
              if ((attempt > 3)); then wait=240; else wait=$((60 << (attempt - 1))); fi
              wait=$((wait + RANDOM % (wait / 2 + 1)))
            fi
            ((wait >= 1)) || wait=1
            spent=$(cat "$API_RETRY_LEDGER" 2> /dev/null); [[ $spent =~ ^[0-9]+$ ]] || spent=0
            if ((attempt >= API_MAX_ATTEMPTS || spent + wait > API_RETRY_BUDGET_SECONDS)); then
              echo "::error::rate limited, no verdict: $2 $3 (HTTP $API_CODE) not completed after $attempt attempt(s), ${spent}s of the ${API_RETRY_BUDGET_SECONDS}s retry budget spent (next wait ${wait}s)" >&2
              return 1
            fi
            echo "ci-gate: rate limited (HTTP $API_CODE), attempt $attempt of $API_MAX_ATTEMPTS; retrying in ${wait}s (retry budget ${spent}/${API_RETRY_BUDGET_SECONDS}s)" >&2
            # A budget that cannot be recorded cannot be enforced: fail rather than wait without bound.
            echo $((spent + wait)) > "$API_RETRY_LEDGER" || {
              echo "::error::rate limited, no verdict: the retry ledger $API_RETRY_LEDGER is not writable, so the retry budget cannot be kept" >&2
              return 1
            }
            "${CI_GATE_SLEEP:-sleep}" "$wait"
          }

          # api_request <GET|POST> <path> [gh field args...] -> 0 with $API_BODY (a file: the body, the cached
          # one on 304) and $API_LINK (the Link header of the page), 1 on any failure, 2 when rate limited past
          # the attempts or the budget. GET is conditional on the cached ETag of that exact path.
          api_request() {
            local method=$1 path=$2; shift 2
            local key raw attempt=0 cond=() gh_rc
            key=$(printf '%s %s' "$method" "$path" | sha256sum | cut -c1-40)
            raw="$API_CACHE/$key.raw"
            while :; do
              attempt=$((attempt + 1)); cond=()
              if [[ $method == GET && -s $API_CACHE/$key.etag && -f $API_CACHE/$key.body ]]; then
                cond=(-H "If-None-Match: $(cat "$API_CACHE/$key.etag")")
              fi
              gh_rc=0
              gh api -i -X "$method" "${cond[@]}" "$path" "$@" > "$raw" 2> "$raw.err" || gh_rc=$?
              api_split "$raw"
              [[ -z ${API_STATS:-} ]] || echo "$API_CODE $method $path" >> "$API_STATS"
              case $API_CODE in
                2??)
                  # gh exits non-zero on a transport failure or a truncated transfer: never cache or trust that.
                  if ((gh_rc != 0)); then cat "$raw.err" >&2; return 1; fi
                  API_LINK=$(api_header link)
                  if [[ $method == GET ]]; then
                    # Etag out first, body and link next, etag last: an interrupted write leaves no etag, so no
                    # later 304 can pair an old etag with a half-written body. Any failed write fails the call.
                    rm -f "$API_CACHE/$key.etag"
                    cp "$API_BODY_RAW" "$API_CACHE/$key.body" \
                      && printf '%s\n' "$API_LINK" > "$API_CACHE/$key.link" \
                      && api_header etag > "$API_CACHE/$key.etag.new" \
                      && mv "$API_CACHE/$key.etag.new" "$API_CACHE/$key.etag" || return 1
                    API_BODY="$API_CACHE/$key.body"
                  else
                    API_BODY=$API_BODY_RAW
                  fi
                  return 0 ;;
                304)
                  [[ $method == GET && -f $API_CACHE/$key.body ]] || return 1
                  # A 304 may leave out Link: then the page's own, cached with its body, still holds.
                  API_LINK=$(api_header link)
                  if [[ -n $API_LINK ]]; then printf '%s\n' "$API_LINK" > "$API_CACHE/$key.link" || return 1
                  else API_LINK=$(cat "$API_CACHE/$key.link" 2> /dev/null); fi
                  API_BODY="$API_CACHE/$key.body"; return 0 ;;
              esac
              if api_is_rate_limited "$raw.err"; then
                api_backoff "$attempt" "$method" "$path" || return 2
                continue
              fi
              cat "$raw.err" >&2
              return 1
            done
          }

          # api_list <path with ?query, no page=> <jq selecting the array of one page> -> the items of every page
          # as one JSON array on stdout. Fails (1) on any page error, a non-array page, or more than API_MAX_PAGES.
          api_list() {
            local path=$1 sel=$2 page=1 acc next
            acc=$(mktemp "$API_CACHE/list.XXXXXX") || return 1
            echo '[]' > "$acc"
            while :; do
              api_request GET "$path&page=$page" || { rm -f "$acc"; return 1; }
              jq -e "$sel | type == \"array\"" "$API_BODY" > /dev/null 2>&1 || { rm -f "$acc"; return 1; }
              jq -cs ".[0] + (.[1] | $sel)" "$acc" "$API_BODY" > "$acc.n" && mv "$acc.n" "$acc" || { rm -f "$acc"; return 1; }
              [[ $API_LINK == *'rel="next"'* ]] || break
              page=$((page + 1))
              ((page <= API_MAX_PAGES)) || { echo "::error::ci-gate-api: more than $API_MAX_PAGES pages at $path" >&2; rm -f "$acc"; return 1; }
            done
            cat "$acc"; rm -f "$acc"
          }

          status_matches() { # <state> <description> -> "same" only if the combined status holds exactly this for $CONTEXT
            local r
            r=$(api_list "repos/$REPO/commits/$HEAD_SHA/status?per_page=100" '.statuses' \
              | jq -r --arg c "$CONTEXT" --arg s "$1" --arg d "$2" \
                'if type == "array" and any(.[]; type == "object" and .context == $c and .state == $s and (.description // "") == $d) then "same" else "differs" end' 2> /dev/null) || return 0
            printf '%s\n' "$r"
          }

          post_status() { # <state> <description, at most 140 characters>: 0 written or skipped, 1 refused, 2 rate limited
            local rc
            if [[ $(status_matches "$1" "$2") == same ]]; then
              echo "ci-gate: status already $1 with this description on $HEAD_SHA; write skipped (1000-status cap)"
              return 0
            fi
            api_request POST "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="$1" -f context="$CONTEXT" -f description="$2" \
              -f target_url="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
            rc=$?
            # shellcheck disable=SC2034
            ((rc != 2)) || CI_GATE_RATE_LIMITED=1
            return "$rc"
          }
          CI_GATE_STATUS_EOF
          # One cache and one rate-limit retry budget for every step of this job.
          echo "API_CACHE=$RUNNER_TEMP/ci-gate-api" >> "$GITHUB_ENV"
          echo "CI_GATE_STATUS_LIB=$lib" >> "$GITHUB_ENV"
      - name: Mark a started or re-run workflow pending
        env:
          EVENT_ACTION: ${{ github.event.action }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        # First step after input validation: it needs only gh, the repository, the head SHA and
        # the context, and runs before any suite file is fetched. A run that starts (or is
        # re-run) must stop the previous verdict, a possible success, from standing at once.
        # The verdict step later overwrites it; the later write is always a fresh evaluation.
        # A pending that already stands with the same description is not written again.
        run: |
          set -uo pipefail
          # shellcheck source=/dev/null
          source "$CI_GATE_STATUS_LIB"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # the pull_request run then waits, so the context stands pending meanwhile.
            desc="waiting for the required checks to report"
          else
            [[ "$EVENT_ACTION" == in_progress ]] || { echo "event action '$EVENT_ACTION': no early pending"; exit 0; }
            # A character outside the BMP (an emoji) becomes '?': GitHub answers HTTP 422
            # "Description doesn't accept 4-byte Unicode" to it, and no verdict would follow.
            desc=$(jq -rn --arg n "$RUN_NAME" '"re-run started: " + $n | explode | map(if . > 65535 then 63 else . end) | implode | if length > 140 then .[0:139] + "…" else . end')
          fi
          post_status pending "$desc" || {
            (($? == 2)) || echo "::error::could not publish the re-run pending status; NO VERDICT WAS PRODUCED"
            exit 1
          }
          echo "$CONTEXT = pending: $desc"
      - name: Let a burst of workflow_run events settle
        # Several runs of one commit start and finish within seconds. The job's concurrency
        # group cancels this run when a newer event for the same commit arrives, so waiting
        # here, before the suite is read, lets a cancelled run spend no further API call.
        # The early pending above has already stopped a previous verdict from standing.
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == workflow_run && "$QUIET_SECONDS" -gt 0 ]] || { echo "no quiet period for $EVENT_NAME"; exit 0; }
          echo "waiting ${QUIET_SECONDS}s for newer events for $HEAD_SHA"
          sleep "$QUIET_SECONDS"
      - name: Read the profile and the verdict scripts from this suite at its own commit
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        # job.workflow_repository / job.workflow_sha name the reusable workflow file's own
        # repository and commit, so the profile selected by github.repository is read at
        # the SHA the caller pinned. Empty means the runner cannot say: fail, do not guess.
        run: |
          set -euo pipefail
          [[ "$WF_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ && "${WF_REPO#*/}" != . && "${WF_REPO#*/}" != .. ]] \
            || { echo "::error::job.workflow_repository is empty or malformed ('$WF_REPO'); no profile can be pinned. NO CHECK WAS PERFORMED."; exit 1; }
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::job.workflow_sha is empty or not a 40-hex commit ('$WF_SHA'); no profile can be pinned. NO CHECK WAS PERFORMED."; exit 1; }
          suite="$RUNNER_TEMP/ci-gate-suite"
          rm -rf "$suite"; mkdir -p "$suite/scripts" "$suite/profiles/ci-gate"
          # One shallow git fetch of the suite commit replaces seven contents-API reads, so the
          # REST budget the gate shares with every other workflow is not spent on these files.
          # The fetch is anonymous: a private suite, or a network that refuses it, falls back
          # to the contents API. FETCH_HEAD must be the pinned commit, or nothing is read from it.
          src="$RUNNER_TEMP/ci-gate-src"
          rm -rf "$src"; git init -q "$src"
          via=api
          if GIT_TERMINAL_PROMPT=0 git -C "$src" fetch -q --depth 1 --no-tags "https://github.com/$WF_REPO" "$WF_SHA" 2>/dev/null \
            && [[ "$(git -C "$src" rev-parse FETCH_HEAD)" == "$WF_SHA" ]]; then
            via=git
          else
            echo "::notice::could not git-fetch $WF_REPO@$WF_SHA; reading the suite through the contents API"
          fi
          fetch() { # <path in the suite> -> same path under $suite; refuses an empty file
            if [[ "$via" == git ]]; then
              git -C "$src" cat-file blob "$WF_SHA:$1" > "$suite/$1" 2>/dev/null \
                || { echo "::error::could not read $1 from $WF_REPO@$WF_SHA"; return 1; }
            else
              gh api -H 'Accept: application/vnd.github.raw+json' "repos/$WF_REPO/contents/$1?ref=$WF_SHA" > "$suite/$1" \
                || { echo "::error::could not read $1 from $WF_REPO@$WF_SHA"; return 1; }
            fi
            [[ -s "$suite/$1" ]] || { echo "::error::$1 at $WF_REPO@$WF_SHA is empty"; return 1; }
          }
          fetch scripts/ci-gate-verdict.sh
          fetch scripts/validate-ci-gate-profile.sh
          fetch scripts/ci-gate-publish.sh
          fetch scripts/ci-gate-sweep.sh
          fetch scripts/ci-gate-tamper-guard.sh
          fetch scripts/ci-gate-tamper-status.sh
          fetch profiles/ci-gate/validate.jq
          fetch profiles/ci-gate/select-runs.jq
          mkdir -p "$suite/profiles/ci-gate/${REPO%%/*}"
          fetch "profiles/ci-gate/$REPO.json" \
            || { echo "::error::no CI/gate profile for $REPO at $WF_REPO@$WF_SHA; add profiles/ci-gate/$REPO.json to the suite. The gate fails closed without one."; exit 1; }
          echo "suite=$suite" >> "$GITHUB_ENV"
          echo "Profile for $REPO read from $WF_REPO@$WF_SHA (via $via)"
      - name: Validate the profile
        run: bash "$suite/scripts/validate-ci-gate-profile.sh" "$suite/profiles/ci-gate/$REPO.json" "$REPO" "$CONTEXT"
      - name: Evaluate the commit and publish the status
        id: publish
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        # All of the reading, the settle guard and the publishing is scripts/ci-gate-publish.sh
        # (fetched from the suite above), so a stub `gh` can test it offline. On schedule and
        # workflow_dispatch scripts/ci-gate-sweep.sh runs that same publisher once per open pull
        # request head and the default branch head. The workflow only hands them values through env.
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            SUITE="$suite" WORK="$RUNNER_TEMP/ci-gate-work" WAIT_SECONDS=0 bash "$suite/scripts/ci-gate-publish.sh"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            # pull_request path: one evaluation, so wait (bounded) for the required checks to report.
            SUITE="$suite" WORK="$RUNNER_TEMP/ci-gate-work" WAIT_SECONDS=$((WAIT_MINUTES * 60)) \
              bash "$suite/scripts/ci-gate-publish.sh"
          else
            SUITE="$suite" WORK="$RUNNER_TEMP/ci-gate-sweep" bash "$suite/scripts/ci-gate-sweep.sh"
          fi
      - name: Publish the gate tamper guard status (default-branch evaluators only)
        # The tamper guard used to run from a pull_request_target caller, which an Actions event policy
        # blocks (and GitHub blocks by default in public repositories from 2 Dec 2026). It now runs here,
        # from the default branch: on workflow_run `completed` for every open pull request whose head is the
        # run's head SHA, forks included (the publisher lists the open pull requests itself; PR_NUMBERS is
        # deliberately NOT set, because workflow_run.pull_requests names same-repository pull requests only
        # and would hide an unapproved fork pull request sharing the head), and in the sweep for every open
        # pull request head. Never on the pull_request job, which a pull request can edit. It publishes
        # `CI/gate-tamper-guard` and does not change the CI/gate verdict.
        # AGENTS MUST NEVER APPLY THE APPROVAL LABEL.
        if: ${{ !cancelled() && github.event_name == 'workflow_run' && github.event.action == 'completed' }}
        run: |
          set -euo pipefail
          SUITE="$suite" bash "$suite/scripts/ci-gate-tamper-status.sh"
      - name: Publish a failure status when no verdict could be produced
        if: ${{ failure() && steps.publish.outputs.published != 'true' }}
        run: |
          set -uo pipefail
          ctx_re='^[A-Za-z0-9]([A-Za-z0-9._/-]| [A-Za-z0-9._/-]){0,127}$'
          [[ ( $EVENT_NAME == workflow_run || $EVENT_NAME == pull_request ) && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && ${#CONTEXT} -le 128 && $CONTEXT =~ $ctx_re ]] || exit 0
          [[ -f ${CI_GATE_STATUS_LIB:-} ]] || { echo "::warning::the status writer was not written; no failure status"; exit 0; }
          # shellcheck source=/dev/null
          source "$CI_GATE_STATUS_LIB"
          post_status failure "ci-gate could not produce a verdict (profile or API error); see the run" \
            || echo "::warning::could not publish the failure status either"
