# This workflow is managed by gh actions-lock.

# SPDX-License-Identifier: MPL-2.0
{
  name: "Code Hygiene Self-Test",
  on: {
    push: {
      branches: [
        "main",
      ],
      paths: [
        "actions/code-hygiene-check/**",
        "actions/affirmation-check/**",
        "actions/referencing-check/**",
        "actions/secrets-check/**",
        "actions/boj-cartridge-check/**",
        "actions/custom-tools-check/**",
        "actions/contractile-validation-check/**",
        "actions/proof-runner-check/**",
        "actions/vaulted-tokens-check/**",
        "actions/www-compliance-check/**",
        "actions/manifest-check/**",
        "actions/required-files-check/**",
        "actions/spdx-license-check/**",
        "actions/formatting-check/**",
        "actions/badges-check/**",
        "actions/metrics-check/**",
        "actions/tests-benches-check/**",
        "tests/**",
        "scripts/deonboard-estate-audit.sh",
        "scripts/deonboard-workflow.sh",
        "proven/**",
        "templates/**",
        "scripts/proven-stamp.sh",
        "scripts/proven-coverage-collect.sh",
        "scripts/proven-shell-coverage.sh",
        "scripts/proven-coverage-gate.sh",
        "scripts/proven-coverage.sh",
        ".proven/**",
        "scripts/coverdata-to-lcov.exs",
        "scripts/ci-gate-verdict.sh",
        "scripts/ci-gate-publish.sh",
        "scripts/ci-gate-sweep.sh",
        "scripts/ci-gate-tamper-guard.sh",
        "scripts/validate-ci-gate-profile.sh",
        "profiles/ci-gate/**",
        ".github/workflows/ci-gate.yml",
        ".github/workflows/ci-gate-caller.yml",
        ".github/workflows/ci-gate-tamper-guard*.yml",
        ".github/workflows/proven-lock-gate.yml",
        ".github/workflows/code-hygiene-self-test.yml",
        ".github/workflows/actions.lock",
        # lock-transitive-closure.sh reads the literal cicd-suite SHA pins in
        # this file: a repin PR must re-run it, or main stays red after the cure.
        ".github/workflows/main-estate-audit.yml",
      ],
    },
    # Weekly: the praxis job below compares the map with Hypatia's and the
    # squabbler's default branches, so a rule either adds after its pinned
    # commit is seen within a week instead of when someone next moves the pin.
    schedule: [
      {
        cron: "41 4 * * 1",
      },
    ],
    workflow_dispatch: {},
    pull_request: {
      paths: [
        "actions/code-hygiene-check/**",
        "actions/affirmation-check/**",
        "actions/referencing-check/**",
        "actions/secrets-check/**",
        "actions/boj-cartridge-check/**",
        "actions/custom-tools-check/**",
        "actions/contractile-validation-check/**",
        "actions/proof-runner-check/**",
        "actions/vaulted-tokens-check/**",
        "actions/www-compliance-check/**",
        "actions/manifest-check/**",
        "actions/required-files-check/**",
        "actions/spdx-license-check/**",
        "actions/formatting-check/**",
        "actions/badges-check/**",
        "actions/metrics-check/**",
        "actions/tests-benches-check/**",
        "tests/**",
        "scripts/deonboard-estate-audit.sh",
        "scripts/deonboard-workflow.sh",
        "proven/**",
        "templates/**",
        "scripts/proven-stamp.sh",
        "scripts/proven-coverage-collect.sh",
        "scripts/proven-shell-coverage.sh",
        "scripts/proven-coverage-gate.sh",
        "scripts/proven-coverage.sh",
        ".proven/**",
        "scripts/coverdata-to-lcov.exs",
        "scripts/ci-gate-verdict.sh",
        "scripts/ci-gate-publish.sh",
        "scripts/ci-gate-sweep.sh",
        "scripts/ci-gate-tamper-guard.sh",
        "scripts/validate-ci-gate-profile.sh",
        "profiles/ci-gate/**",
        ".github/workflows/ci-gate.yml",
        ".github/workflows/ci-gate-caller.yml",
        ".github/workflows/ci-gate-tamper-guard*.yml",
        ".github/workflows/proven-lock-gate.yml",
        ".github/workflows/code-hygiene-self-test.yml",
        ".github/workflows/actions.lock",
        # lock-transitive-closure.sh reads the literal cicd-suite SHA pins in
        # this file: a repin PR must re-run it, or main stays red after the cure.
        ".github/workflows/main-estate-audit.yml",
      ],
    },
  },
  permissions: {
    contents: "read",
  },
  concurrency: {
    # The event is part of the key, so a weekly or dispatched drift run and a
    # push to main never cancel each other.
    group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}",
    cancel-in-progress: true,
  },
  jobs: {
    # Deliberately a SEPARATE job from `test`. The `test` job invokes composite
    # actions, which drag transitive `uses:` edges into actions.lock; when one of
    # those pins goes stale the job dies in `prepare`, before a single step runs —
    # which is exactly how the defect this suite covers stayed invisible. This job
    # touches nothing but checkout, so its square always reflects the suite.
    # For the same reason it is where the actions.lock closure guard runs: a lock
    # that is missing a composite-reached pin kills `Gate controls` in `Set up job`,
    # so a check living there could never report the very defect it tests for.
    shell-contract: {
      name: "Composite shell contract",
      runs-on: "ubuntu-latest",
      timeout-minutes: 5,
      steps: [
        {
          uses: "actions/checkout@v7.0.1",
          with: {
            persist-credentials: false,
            # lock-transitive-closure.sh compares the actions/ tree at the commit
            # the lockfile pins against HEAD's, so it needs that commit present.
            fetch-depth: 0,
          },
        },
        {
          run: "bash tests/composite-shell-contract.sh",
        },
        {
          # Tool-absent gates must report not_run/exit 2, never a pass;
          # the fixed gates must also stay out of main-estate-audit,
          # which installs none of their tools.
          run: "bash tests/pass-on-absence.sh",
        },
        {
          # Exercise both exact suite names, stale pins, missing history and
          # nonempty populations before checking the real imported source.
          run: "bash tests/lock-self-source-controls.sh",
        },
        {
          run: "bash tests/lock-transitive-closure.sh",
        },
        {
          # scripts/deonboard-workflow.sh, through both entry points, against
          # every actions.lock schema it claims to support; an untested schema
          # must fail closed.
          run: "bash tests/deonboard-lock-schemas.sh",
        },
        {
          # The same script must not prune a dependency still reached by a
          # lower-case nested `uses:` edge, through either entry point.
          run: "bash tests/deonboard-estate-audit.sh",
        },
        {
          # The rerun policy table agrees with the A5/SQ map and the cap of one
          # rerun per job, and the controls show the test can fail.
          run: "bash tests/retry-policy.sh && bash tests/retry-policy-controls.sh && bash tests/retry-hypatia-controls.sh && bash tests/generated-policy.sh && bash tests/generated-policy-controls.sh",
        },
        {
          # Toolchain pins live in one file, and stamped templates agree with it.
          run: "bash tests/toolchain-pins.sh && bash tests/toolchain-pins-controls.sh",
        },
        {
          # The one map between Hypatia A5 ids and squabbler ids, and the
          # negative controls that show its conformance test can fail.
          run: "bash tests/registry-sq-map.sh && bash tests/registry-sq-map-controls.sh",
        },
        {
          # The published manifest of stamped artifacts, which the applier's
          # BEHIND-CONTENT census reads, agrees with every stamped body.
          run: "bash tests/proven-manifest.sh",
        },
        {
          # Install mode: the contract for the applier's content-only rewrite,
          # checked as a model with mutant controls (spec: docs/proven/INSTALL-MODE.adoc).
          run: "bash tests/proven-install-mode.sh",
        },
        {
          # The stamped coverage collector: stamp, manifest entry, lint, exit
          # codes (never 1), and real runs on tiny Rust, Mix and JS fixtures
          # where the toolchain is present (a missing one is named SKIP).
          run: "bash tests/proven-coverage-collect.sh",
        },
        {
          # The interim CI/gate: the pure verdict (a required check that never
          # reported is a failure, never a pass), the profile validator, the
          # shipped profiles, and static guards on the reusable and its caller.
          run: "bash tests/ci-gate.sh",
        },
        {
          # The tamper guard: file matching, label logic, fail-closed errors, static guards.
          run: "bash tests/ci-gate-tamper-guard.sh",
        },
        {
          # The shell coverage tracer and gate: lcov statements and hits on
          # fixtures, exclusion matching, and the firing and silence controls.
          # Hard: a tracer that miscounts would make every coverage report lie.
          run: "bash tests/proven-coverage-gate.sh",
        },
      ],
    },
    # The whole-repository coverage run (scripts/proven-coverage.sh). Report
    # only: it writes its findings to the job summary and never blocks a merge,
    # until the estate decides the uncovered statements are worth gating.
    # actionlint comes from the pin in proven/pins/toolchain.tsv, built with the
    # runner's Go toolchain, so this job adds no `uses:` to the actions.lock closure.
    coverage-report: {
      name: "Coverage report (non-blocking)",
      runs-on: "ubuntu-latest",
      timeout-minutes: 20,
      continue-on-error: true,
      steps: [
        {
          uses: "actions/checkout@v7.0.1",
          # Full history: lock-transitive-closure.sh resolves pinned commits in this clone.
          with: { persist-credentials: false, fetch-depth: 0 },
        },
        {
          # actionlint runs shellcheck when it is on PATH. The runner image ships one
          # at a floating version; the pinned release replaces it, checked by sha256.
          name: "Install pinned shellcheck",
          run: "v=$(awk -F'\\t' '$1 == \"shellcheck\" { print $2 }' proven/pins/toolchain.tsv)\ntest \"$v\" = 0.10.0\nf=shellcheck-v$v.linux.x86_64.tar.xz\ncurl -sSfL -o \"$RUNNER_TEMP/$f\" \"https://github.com/koalaman/shellcheck/releases/download/v$v/$f\"\necho \"6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $RUNNER_TEMP/$f\" | sha256sum -c -\nmkdir -p \"$RUNNER_TEMP/bin\"\ntar -xJf \"$RUNNER_TEMP/$f\" -C \"$RUNNER_TEMP\"\ncp \"$RUNNER_TEMP/shellcheck-v$v/shellcheck\" \"$RUNNER_TEMP/bin/\"\necho \"$RUNNER_TEMP/bin\" >> \"$GITHUB_PATH\"\n",
        },
        {
          name: "Install pinned actionlint",
          run: "v=$(awk -F'\\t' '$1 == \"actionlint\" { print $2 }' proven/pins/toolchain.tsv)\ntest -n \"$v\"\nGOBIN=\"$RUNNER_TEMP/bin\" go install \"github.com/rhysd/actionlint/cmd/actionlint@v$v\"\necho \"$RUNNER_TEMP/bin\" >> \"$GITHUB_PATH\"\n",
        },
        {
          name: "Coverage run",
          run: "rc=0\nbash scripts/proven-coverage.sh \"$RUNNER_TEMP/coverage\" > \"$RUNNER_TEMP/coverage.log\" 2>&1 || rc=$?\n{\n  echo \"## Coverage report (exit $rc, non-blocking)\"\n  echo '```'\n  tail -n 200 \"$RUNNER_TEMP/coverage.log\"\n  echo '```'\n} >> \"$GITHUB_STEP_SUMMARY\"\ncat \"$RUNNER_TEMP/coverage.log\"\n# Each failing or not-run test's own log, so a runner-only failure can be triaged.\nawk -F'\\t' '$1 != 0 { print $2 }' \"$RUNNER_TEMP/coverage/tests.tsv\" | while IFS= read -r t; do\n  echo \"::group::log of $t\"\n  tail -n 60 \"$RUNNER_TEMP/coverage/log.${t//\\//_}\"\n  echo '::endgroup::'\ndone\nif [ \"$rc\" -ne 0 ]; then echo \"::warning title=Coverage report::proven-coverage.sh exited $rc (report only, see the job summary)\"; fi\n",
        },
      ],
    },
    # proven/registry/sq-map.tsv against both of its sources: the praxis column
    # against Hypatia's A5 registry, in both directions (HYPATIA_PRAXIS), and
    # the SQ ids against the squabbler's first-line rule table, in both
    # directions (SQUABBLER_RULES). On a push or pull request each source is
    # read at a pinned commit (move a pin when that source changes); on the
    # weekly schedule or a dispatch each is read at its default branch, which
    # is how drift after a pin is seen. Both come in through a git checkout at
    # that commit, so their content is verified by git's object hashes rather
    # than downloaded unverified. The job keeps its earlier name, so the check
    # context it reports under is unchanged.
    praxis-registry: {
      name: "SQ map against Hypatia's praxis registry",
      runs-on: "ubuntu-latest",
      timeout-minutes: 5,
      steps: [
        {
          uses: "actions/checkout@v7.0.1",
          with: {
            persist-credentials: false,
          },
        },
        {
          uses: "actions/checkout@v7.0.1",
          with: {
            repository: "hyperpolymath/hypatia",
            ref: "${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || '59e6abed64d9b6c14c4c0993451cca352b2ca070' }}",
            path: "hypatia-registry",
            sparse-checkout: "hypatia_rules_praxis.deed\nlib/rules/ci_failure_triage.ex",
            sparse-checkout-cone-mode: false,
            persist-credentials: false,
          },
        },
        {
          uses: "actions/checkout@v7.0.1",
          with: {
            repository: "hyperpolymath/cicd-squabbler",
            ref: "${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || '09e6790d188444abb2a96adba758984fb3cf13e0' }}",
            path: "squabbler-rules",
            sparse-checkout: "crates/squabble-core/data/first-line-rules.tsv",
            sparse-checkout-cone-mode: false,
            persist-credentials: false,
          },
        },
        {
          # Which registry was checked out, for the pending-row rule: `head`
          # on the schedule and on a dispatch (Hypatia main, so a pending row
          # whose rule has merged is a WARN), `pin` otherwise (so a pin move
          # that passes a pending row without flipping it fails).
          env: {
            HYPATIA_PRAXIS_AT: "${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'head' || 'pin' }}",
          },
          run: "HYPATIA_PRAXIS=hypatia-registry/hypatia_rules_praxis.deed SQUABBLER_RULES=squabbler-rules/crates/squabble-core/data/first-line-rules.tsv bash tests/registry-sq-map.sh && bash tests/retry-hypatia.sh hypatia-registry/lib/rules/ci_failure_triage.ex && HYPATIA_RULES=hypatia-registry/lib/rules/ci_failure_triage.ex bash tests/generated-policy.sh",
        },
      ],
    },
    test: {
      name: "Gate controls",
      runs-on: "ubuntu-latest",
      timeout-minutes: 10,
      steps: [
        {
          uses: "actions/checkout@v7.0.1",
          with: {
            persist-credentials: false,
          },
        },
        {
          run: "bash actions/code-hygiene-check/test.sh",
        },
        {
          run: "bash actions/affirmation-check/test.sh",
        },
        {
          run: "bash actions/referencing-check/test.sh",
        },
        {
          run: "bash actions/secrets-check/test.sh",
        },
        {
          # Observer contract's silent, firing and no-check control cases.
          run: "bash actions/tests-benches-check/test.sh",
        },
        {
          run: "bash actions/boj-cartridge-check/test.sh",
        },
        {
          name: "Badge applicability controls (advisory, not accreditation)",
          run: "bash actions/badges-check/test.sh",
        },
        {
          name: "Metrics evidence controls (advisory, not proof)",
          run: "bash actions/metrics-check/test.sh",
        },
        {
          name: "Create manifest controls",
          id: "fixtures",
          shell: "bash",
          run: "root=\"$RUNNER_TEMP/manifest-controls\"\nmkdir -p \"$root/valid\" \"$root/bad-deed\" \"$root/bad-k9\"\nprintf '%s\\n' '# SPDX-License-Identifier: MPL-2.0' 'agent-id = \"ci-control\"' 'version = \"1.0.0\"' > \"$root/valid/control.deed\"\nprintf '%s\\n' 'K9!' '# SPDX-License-Identifier: MPL-2.0' 'pedigree = {' '  metadata = { name = \"ci-control\", version = \"1.0.0\" },' \"  security = { leash = 'Kennel },\" '}' > \"$root/valid/control.k9.ncl\"\nprintf '%s\\n' 'invalid manifest' > \"$root/bad-deed/control.deed\"\n# K9-suffixed library modules are outside pedigree validation. Give\n# this negative control a real contract marker and omit its pedigree.\nprintf '%s\\n' 'K9!' '# SPDX-License-Identifier: MPL-2.0' 'invalid manifest' > \"$root/bad-k9/control.k9.ncl\"\necho \"root=$root\" >> \"$GITHUB_OUTPUT\"\n",
        },
        {
          name: "Valid manifests must pass",
          uses: "$/actions/manifest-check",
          with: {
            path: "${{ steps.fixtures.outputs.root }}/valid",
          },
        },
        {
          name: "Invalid DEED manifest must fail",
          id: "bad-deed",
          continue-on-error: true,
          uses: "$/actions/manifest-check",
          with: {
            path: "${{ steps.fixtures.outputs.root }}/bad-deed",
          },
        },
        {
          name: "Invalid K9 Nickel manifest must fail",
          id: "bad-k9",
          continue-on-error: true,
          uses: "$/actions/manifest-check",
          with: {
            path: "${{ steps.fixtures.outputs.root }}/bad-k9",
          },
        },
        # The ignore lists: each must lift exactly its own validator's finding.
        # The two positives use the same bad fixtures as the negatives above,
        # so they pass only because the named file is skipped.
        {
          name: "An invalid DEED file on the caller's DEED ignore list must pass",
          uses: "$/actions/manifest-check",
          with: {
            path: "${{ steps.fixtures.outputs.root }}/bad-deed",
            deed-paths-ignore: "control.deed",
          },
        },
        {
          name: "An invalid K9 file on the caller's K9 ignore list must pass",
          uses: "$/actions/manifest-check",
          with: {
            path: "${{ steps.fixtures.outputs.root }}/bad-k9",
            k9-paths-ignore: "control.k9.ncl",
          },
        },
        {
          name: "A DEED ignore list must leave K9 validation on",
          id: "deed-ignore-k9-on",
          continue-on-error: true,
          uses: "$/actions/manifest-check",
          with: {
            path: "${{ steps.fixtures.outputs.root }}/bad-k9",
            deed-paths-ignore: "control.k9.ncl",
          },
        },
        {
          name: "Verify the negative controls failed",
          env: {
            DEED_OUTCOME: "${{ steps.bad-deed.outcome }}",
            K9_OUTCOME: "${{ steps.bad-k9.outcome }}",
            CROSS_OUTCOME: "${{ steps.deed-ignore-k9-on.outcome }}",
          },
          run: "test \"$DEED_OUTCOME\" = failure && test \"$K9_OUTCOME\" = failure && test \"$CROSS_OUTCOME\" = failure",
        },
        # formatting-check reads `git ls-files` in the workspace, so its controls
        # run on this checkout: clean it must pass, and with one planted
        # non-.md wiki page it must fail. The annotation that failure produces
        # (file=docs/wikis/README.adoc) is what marid#38 asked for; the shell
        # suite asserts its exact text.
        {
          name: "This repo's own tree must pass the formatting gate",
          uses: "$/actions/formatting-check",
        },
        {
          name: "Plant a non-.md wiki page",
          run: "mkdir -p docs/wikis\n: > docs/wikis/README.adoc\ngit add docs/wikis/README.adoc\n",
        },
        {
          name: "A non-.md wiki page must fail the formatting gate",
          id: "bad-format",
          continue-on-error: true,
          uses: "$/actions/formatting-check",
        },
        {
          name: "Verify the formatting negative control failed",
          env: {
            FORMAT_OUTCOME: "${{ steps.bad-format.outcome }}",
          },
          run: "test \"$FORMAT_OUTCOME\" = failure",
        },
      ],
    },
  },
}
