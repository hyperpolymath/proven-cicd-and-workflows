# SPDX-License-Identifier: MPL-2.0
# Dogfood (DOG-01): this repository's own CI runs through its own umbrella.
name: Proven

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]  # labeled: bench-approved re-runs the gate
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read  # bench-approved label lookup

jobs:
  proven:
    uses: ./.github/workflows/proven.yml
