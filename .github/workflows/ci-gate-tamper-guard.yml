# SPDX-License-Identifier: MPL-2.0
# ⚠ DEPRECATED (2026-11-23). This guard has NEVER started: every run ends in startup_failure because
# the account Actions policy refuses its trigger with
#   "Event 'pull_request_target' is not allowed to trigger Actions workflows."
# (rsr-template-repo 30/30, resource-algebra 50/50, this suite 30/30). The guard now runs INSIDE the
# gate's own verdict (ci-gate.yml -> scripts/ci-gate-publish.sh -> scripts/ci-gate-tamper-guard.sh;
# docs/CI-GATE.adoc, "Tamper guard"). Do not install it anywhere new. It is kept only while consumers
# still reference it; a later pass removes their pull_request_target caller, then this file.
#
#
# ci-gate-tamper-guard.yml (reusable) - fail a pull request that touches the gate's own files
# unless the owner approved the change with the label `gate-change-approved`.
#
# WHY: the gate's pull_request start runs from the pull request's own branch, so a pull request can
# edit the gate and pass itself. This guard is called from a workflow on `pull_request_target`, which
# GitHub runs from the DEFAULT branch, so the pull request cannot edit the guard that judges it.
#
# SAFETY: it never checks out, builds or runs pull request code. It reads the changed-file list, the
# label events and the commit dates through the API, and fetches its one script from THIS suite at
# the commit it was called at (job.workflow_sha). Values reach scripts through env: only. It uses no
# actions. Permissions: pull-requests: read, contents: read. No secrets. No trust decision uses
# github.actor or any other forgeable field.
#
# APPROVAL: the label `gate-change-approved`, applied by a repository ADMIN (checked through the collaborator
# permission API, failing closed) after the newest commit
# (re-apply it after every push). AGENTS MUST NEVER APPLY THAT LABEL: all agents act with the owner's
# account, so this is tamper-EVIDENT and deliberate, not tamper-proof (docs/CI-GATE.adoc, "Tamper guard").
#
# The caller must grant: pull-requests: read, contents: read, and run on pull_request_target with the
# types opened, reopened, synchronize, edited, labeled, unlabeled (edited re-runs the guard when the base branch changes).
name: Gate tamper guard (reusable)

on:
  workflow_call: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Refuse anything but pull_request_target
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == pull_request_target ]] \
            || { echo "::error::the tamper guard runs only on pull_request_target (got '$EVENT_NAME'); NO VERDICT WAS PRODUCED"; exit 1; }
          [[ "$WF_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ && "${WF_REPO#*/}" != . && "${WF_REPO#*/}" != .. && "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::job.workflow_repository / job.workflow_sha are empty or malformed; NO VERDICT WAS PRODUCED"; exit 1; }
      - name: Read the guard script from this suite at its own commit
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tamper-guard"; mkdir -p "$d"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$WF_REPO/contents/scripts/ci-gate-tamper-guard.sh?ref=$WF_SHA" > "$d/guard.sh"
          [[ -s "$d/guard.sh" ]] || { echo "::error::the guard script is empty"; exit 1; }
          echo "guard=$d/guard.sh" >> "$GITHUB_ENV"
      - name: Check the changed files against the gate files
        run: bash "$guard"
