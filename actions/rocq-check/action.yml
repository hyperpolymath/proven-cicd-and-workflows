# SPDX-License-Identifier: MPL-2.0
name: 'Rocq Assumptions Gate'
description: >-
  Rocq (Coq) gate: detect counts the .v sources and refuses a list it cannot
  read; prove asserts the pinned coqc and coqchk (Coq 8.18.0, SHA-256), runs
  planted controls through the same judgement (a closed theorem accepted;
  an Axiom, an Admitted lemma, a Parameter, an ill-typed file, disabled guard,
  universe or positivity checking, and a Notation that forges coqc's output
  refused), compiles each listed file with coqc, then re-checks the compiled
  modules out of process with coqchk and reads its CONTEXT SUMMARY. Nothing the
  file prints is evidence. Required theorems must resolve to a constant of a
  listed module. The reusable workflow .github/workflows/rocq-gate.yml installs
  Coq and runs both phases.
inputs:
  phase:
    description: 'detect | prove'
    required: true
  working_directory:
    description: 'Tree root'
    required: false
    default: '.'
  files:
    description: 'Whitespace-separated .v files to compile, dependencies first'
    required: false
    default: 'verification/proofs/coq/Haruspex.v'
  required_theorems:
    description: 'Whitespace-separated theorem names that must each resolve to a constant of a listed module (existence only; axioms are judged module-wide); empty for none'
    required: false
    default: ''
  allowed_axioms:
    description: 'Whitespace-separated axiom names the module may use (full names as the checker prints them); empty for none. sorryAx is never allowable'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Run Rocq gate phase
      shell: bash
      env:
        ROCQ_GATE_PHASE: ${{ inputs.phase }}
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        FILES: ${{ inputs.files }}
        REQUIRED_THEOREMS: ${{ inputs.required_theorems }}
        ALLOWED_AXIOMS: ${{ inputs.allowed_axioms }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
