# SPDX-License-Identifier: MPL-2.0
name: 'Lean Axioms Gate'
description: >-
  Lean axiom gate for standalone (non-Lake) files: detect counts the .lean
  sources outside any Lake project and refuses a list it cannot read; prove
  asserts the pinned Lean 4.15.0 (bin/lean SHA-256), runs planted controls
  through the same judgement (an axiom-free theorem accepted; a sorry,
  Classical.choice, a declared axiom, an ill-typed file and an unprinted file
  refused), then compiles each listed file with lean and requires every
  #print axioms to report "does not depend on any axioms", the number of
  reports to equal the number of prints, and optionally a named set of
  theorems to be printed. Lake projects belong to proof-runner-check, which
  builds them and does not judge axioms. The reusable workflow
  .github/workflows/lean-axioms-gate.yml installs Lean and runs both phases.
inputs:
  phase:
    description: 'detect | prove'
    required: true
  working_directory:
    description: 'Tree root'
    required: false
    default: '.'
  files:
    description: 'Whitespace-separated standalone .lean files to compile'
    required: false
    default: 'verification/proofs/lean4/Haruspex.lean'
  required_theorems:
    description: 'Whitespace-separated theorem names; the gate runs #print axioms on each itself and it must report no axioms; empty for none'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Run Lean axioms gate phase
      shell: bash
      env:
        LEAN_GATE_PHASE: ${{ inputs.phase }}
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        FILES: ${{ inputs.files }}
        REQUIRED_THEOREMS: ${{ inputs.required_theorems }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
