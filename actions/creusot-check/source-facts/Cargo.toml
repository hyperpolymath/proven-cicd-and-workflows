# SPDX-License-Identifier: MPL-2.0
[package]
name = "creusot-source-facts"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
publish = false

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }

# Standalone: the gate may be checked out inside a caller repository that is
# itself a Cargo workspace; without this table `cargo metadata`/`cargo build`
# on this manifest fail with "current package believes it's in a workspace
# when it's not". An empty table makes this its own workspace root.
[workspace]
