# SPDX-License-Identifier: MPL-2.0
# Lean Axioms Gate — thin caller of the estate's Lean Axioms gate in
# hyperpolymath/proven-cicd-and-workflows. Enforcing, for standalone
# (non-Lake) files: the pinned Lean 4.15.0 compiles each listed file, then the
# gate's own checker re-checks the compiled module out of process: kernel
# replay of every constant, and any axiom a safe constant uses (sorryAx,
# Classical.choice, propext, Quot.sound, a declared axiom) fails, module-wide.
# Nothing the file prints is evidence. Lake projects are proof-runner-check's,
# which builds them and does not judge axioms. Planted controls prove the
# judge can say no before its green is credited.
#
# Require `lean-axioms / Lean axioms verdict`.
#
# Full-SHA pin, DE-ONBOARDED from actions.lock, no `secrets:` — see
# rust-ci.yml in this directory for why. This gate calls no other reusable
# workflow, so `contents: read` is all it holds.
name: Lean Axioms Gate

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean-axioms:
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/lean-axioms-gate.yml@__CICD_SUITE_SHA__ # cicd-suite main
    # Inputs (optional; the defaults are hvn-dehallucinator's layout):
    #   files: verification/proofs/lean4/Haruspex.lean   # whitespace-separated, no Lake project
    #   required_theorems: "name1 name2"                 # each must exist in a listed module
    #   allowed_axioms: ""                               # e.g. "propext"; sorryAx is never allowable
    #                                                    # (empty by default: name the theorems that matter)
