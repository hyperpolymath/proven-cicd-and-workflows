# ⚠ DEPRECATED (2026-11-23). This guard has NEVER started: every run ends in startup_failure because
# the account Actions policy refuses its trigger with
#   "Event 'pull_request_target' is not allowed to trigger Actions workflows."
# (rsr-template-repo 30/30, resource-algebra 50/50, this suite 30/30). The guard now runs INSIDE the
# gate's own verdict (ci-gate.yml -> scripts/ci-gate-publish.sh -> scripts/ci-gate-tamper-guard.sh;
# docs/CI-GATE.adoc, "Tamper guard"). Do not install it anywhere new. It is kept only while consumers
# still reference it; a later pass removes their pull_request_target caller, then this file.
#
# Gate tamper guard - thin caller of the suite's reusable guard; copy to .github/workflows/ci-gate-tamper-guard.yml. pull_request_target runs this file from the
# DEFAULT branch, so a pull request cannot edit it; the job never checks out or runs pull request code
# (it reads the changed-file list through the API). The pin is a full SHA, never @main or a tag.
# A pull request that touches gate files fails this check until the OWNER applies the label
# `gate-change-approved` after the newest commit. AGENTS MUST NEVER APPLY THAT LABEL.
# No `secrets:` line, minimal permissions. See docs/CI-GATE.adoc, "Tamper guard".
name: Gate tamper guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  pull-requests: read
  contents: read

jobs:
  guard:
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/ci-gate-tamper-guard.yml@__CICD_SUITE_SHA__ # cicd-suite tamper guard
