# SPDX-License-Identifier: MPL-2.0
# Manifest for this repository (schema proven/manifest/v1); see docs/PROVEN-ADOPTION.adoc.
schema = "proven/manifest/v1"

# Shell is the repository's test language: tests/{unit,smoke,build,p2p}.sh are
# picked up by convention, so no command is declared here.

[languages.ignore.elixir]
reason = "scripts/coverdata-to-lcov.exs is a single standalone script, not a mix project; it is exercised by tests/proven-coverage-collect.sh"

[languages.ignore.idris2]
reason = "the Idris2 kernels (*.ipkg) build and run in assurance-kernel.yml and proven-lock-gate, which install the Idris2 toolchain; the umbrella cannot provision idris2 in release 0.1"

# Rust: tools/proven-gate carries the real unit tests (unit runs there); it has no smoke
# or p2p tests yet, and actions/creusot-check/source-facts has none on main (#162 adds them).
# Visible, expiring waivers, not N/A.
[categories.smoke.rust.waiver]
reason = "no Rust smoke or p2p test yet; hyperpolymath/proven-cicd-and-workflows#162 and the proven-gate crate follow"
until = "2026-12-10"
[categories.p2p.rust.waiver]
reason = "no Rust smoke or p2p test yet; hyperpolymath/proven-cicd-and-workflows#162 and the proven-gate crate follow"
until = "2026-12-10"
